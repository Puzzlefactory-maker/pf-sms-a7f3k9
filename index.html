<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" id="appleTitle" content="메시지">
<meta name="theme-color" id="themeColor" content="#ffffff">
<link rel="apple-touch-icon" href="./icons/icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-192.png">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link id="manifestLink" rel="manifest" href="./manifest.webmanifest">
<title>메시지</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overscroll-behavior:none; }
  body {
    font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",Roboto,sans-serif;
    background:#000; display:flex; justify-content:center; align-items:center;
    overflow:hidden; overscroll-behavior:none;
  }
  #phone { --safe-b:0px; width:100%; max-width:430px; height:100vh; height:100dvh; max-height:930px; background:#fff;
    position:relative; overflow:hidden; display:flex; flex-direction:column;
    box-shadow:0 0 40px rgba(0,0,0,.4); }

  .screen { flex:1; display:none; flex-direction:column; overflow:hidden; }
  .screen.active { display:flex; }
  #listScreen { display:flex; }
  .scroll { flex:1; overflow-y:auto; min-height:0; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
    padding-bottom:calc(var(--safe-b));padding-bottom:calc(env(safe-area-inset-bottom, 0px) + var(--safe-b)); }

  /* ===== 목록 화면 헤더 ===== */
  .list-head { flex-shrink:0; padding:6px 8px 2px; }
  .list-head .toprow { display:flex; align-items:center; height:44px; padding:0 8px; }
  .list-title { flex:1; font-size:22px; font-weight:700; color:#111; letter-spacing:-.3px; user-select:none; }
  .head-icons { display:flex; gap:2px; }
  .head-icons button { width:40px; height:40px; border:none; background:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:#3c3c3c; border-radius:50%; }
  .head-icons svg { width:23px; height:23px; }
  .searchbar { margin:6px 16px 8px; height:42px; background:#f1f2f4; border-radius:21px;
    display:flex; align-items:center; padding:0 15px; gap:9px; color:#9aa0a6; font-size:14.5px; }
  .searchbar svg { width:19px; height:19px; }

  /* ===== 대화 목록 ===== */
  .thread { display:flex; align-items:center; padding:11px 16px; gap:13px; cursor:pointer; }
  .thread:active { background:#f5f6f8; }
  .avatar { width:52px; height:52px; border-radius:50%; overflow:hidden; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:600; color:#fff; }
  .avatar img { width:100%; height:100%; object-fit:cover; }
  .thread-meta { flex:1; min-width:0; }
  .thread-name-row { display:flex; align-items:baseline; gap:6px; }
  .thread-name { font-size:15.5px; font-weight:600; color:#141414; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  .thread-name.unreadname { font-weight:700; }
  .thread-pin { font-size:11px; flex-shrink:0; }
  .thread-preview { font-size:13.5px; color:#8b8f94; margin-top:3px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  .thread-preview.unread { color:#2b2b2b; }
  .thread-right { display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0; }
  .thread-time { font-size:12px; color:#9aa0a6; }
  .thread-badge { min-width:19px; height:19px; padding:0 5px; border-radius:10px; background:#ff5a4d;
    color:#fff; font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; }

  .empty { text-align:center; color:#9aa0a6; font-size:14px; line-height:1.9; padding:70px 30px; }

  /* ===== 대화방 화면 ===== */
  .room-head { flex-shrink:0; height:56px; display:flex; align-items:center; padding:0 6px 0 4px;
    border-bottom:1px solid #f0f0f2; background:#fff; gap:4px; }
  .room-head .back { width:42px; height:44px; border:none; background:none; font-size:30px;
    color:#2c2c2c; cursor:pointer; line-height:1; }
  .room-head .r-av { width:36px; height:36px; border-radius:50%; overflow:hidden; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:#fff; }
  .room-head .r-av img { width:100%; height:100%; object-fit:cover; }
  .room-head .r-info { flex:1; min-width:0; margin-left:9px; }
  .room-head .r-name { font-size:16px; font-weight:600; color:#141414; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  .room-head .r-sub { font-size:11.5px; color:#9aa0a6; margin-top:1px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  .room-head .r-icons { display:flex; }
  .room-head .r-icons button { width:42px; height:44px; border:none; background:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:#3c3c3c; }
  .room-head .r-icons svg { width:22px; height:22px; }

  .messages { flex:1; overflow-y:auto; min-height:0; padding:12px 12px 8px; background:#fff;
    -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }

  .date-divider { text-align:center; margin:14px 0 12px; }
  .date-divider span { font-size:11.5px; color:#9aa0a6; background:#f1f2f4; padding:4px 12px; border-radius:12px; }

  .msg-row { display:flex; align-items:flex-end; gap:7px; margin-bottom:3px; }
  .msg-row.mine { flex-direction:row-reverse; }
  .m-av { width:30px; height:30px; border-radius:50%; overflow:hidden; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; color:#fff; align-self:flex-start; margin-top:2px; }
  .m-av img { width:100%; height:100%; object-fit:cover; }
  .m-av.spacer { background:transparent !important; }
  .m-col { max-width:74%; display:flex; flex-direction:column; }
  .msg-row.mine .m-col { align-items:flex-end; }
  .m-sender { font-size:11.5px; color:#8b8f94; margin:2px 0 3px 4px; }
  .m-line { display:flex; align-items:flex-end; gap:6px; }
  .msg-row.mine .m-line { flex-direction:row-reverse; }
  .bubble { padding:9px 13px; border-radius:19px; font-size:14.5px; line-height:1.42; color:#141414;
    background:#f1f2f4; word-break:break-word; white-space:pre-wrap; }
  .msg-row.mine .bubble { background:#0a7cff; color:#fff; }
  .bubble.img-bubble { padding:3px; background:#f1f2f4; cursor:pointer; }
  .msg-row.mine .bubble.img-bubble { background:#e3effd; }
  .bubble.img-bubble img { display:block; max-width:210px; width:100%; border-radius:16px; }
  .bubble.img-bubble .cap { padding:6px 9px 4px; font-size:14px; color:#141414; }
  .m-info { display:flex; flex-direction:column; align-items:flex-end; gap:1px; margin-bottom:1px; }
  .msg-row:not(.mine) .m-info { align-items:flex-start; }
  .m-time { font-size:10.5px; color:#9aa0a6; white-space:nowrap; }
  .m-status { font-size:10.5px; color:#0a7cff; white-space:nowrap; font-weight:500; }

  /* 하단 입력바 (장식용, 손님 모드에서 비활성) */
  .inputbar { flex-shrink:0; display:flex; align-items:center; gap:9px;
    padding:8px 12px calc(8px + var(--safe-b));padding:8px 12px calc(8px + env(safe-area-inset-bottom, 0px) + var(--safe-b));
    border-top:1px solid #f0f0f2; background:#fff; }
  .inputbar .plus { width:26px; height:26px; color:#8b8f94; flex-shrink:0; }
  .inputbar .fake-input { flex:1; height:38px; background:#f1f2f4; border-radius:19px;
    display:flex; align-items:center; padding:0 15px; color:#9aa0a6; font-size:14px; }
  .inputbar .send { width:36px; height:36px; border-radius:50%; background:#c9ccd1; color:#fff;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .inputbar .send svg { width:19px; height:19px; }

  /* ===== 사진 크게 보기 ===== */
  #photoViewer { display:none; position:absolute; top:0;right:0;bottom:0;left:0; z-index:200; background:#000;
    align-items:center; justify-content:center; }
  #photoViewer.show { display:flex; }
  #photoViewer img { max-width:100%; max-height:100%; object-fit:contain; }
  #photoViewer .pv-close { position:absolute; top:14px; right:14px; width:38px; height:38px;
    border-radius:50%; border:none; background:rgba(255,255,255,.18); color:#fff; font-size:18px; cursor:pointer; }


  /* ===== 관리자 패널 ===== */
  #adminOverlay { display:none; position:absolute; top:0;right:0;bottom:0;left:0; background:#f4f5f7; z-index:50; flex-direction:column; }
  #adminOverlay.active { display:flex; }
  .admin-header { background:#22303c; color:#fff; padding:14px 16px; display:flex;
    align-items:center; justify-content:space-between; flex-shrink:0; }
  .admin-header h2 { font-size:17px; font-weight:700; }
  .admin-header .row-actions { display:flex; gap:8px; }
  .admin-header button { background:rgba(255,255,255,.16); color:#fff; border:none;
    padding:8px 13px; border-radius:8px; font-size:13px; cursor:pointer; }
  .admin-body { flex:1; overflow-y:auto; padding:16px; }

  /* 모바일: 한 번에 한 칸만 보여준다 (지금까지와 같은 방식) */
  #adminBody:not(.thread-open) #paneThread,
  #adminBody:not(.thread-open) #paneMsgs { display:none; }
  #adminBody.thread-open #paneHome { display:none; }
  .pane-empty { color:#98a5b2; font-size:13px; text-align:center; padding:40px 16px; }

  /* 이 폰을 쓸 지점 고르기 — 고르기 전에는 내용이 전혀 보이지 않는다 */
  #pickBranch { position:absolute; top:0;right:0;bottom:0;left:0; z-index:70; background:#34c759; display:none;
                align-items:center; justify-content:center; padding:22px; }
  #pickBranch.show { display:flex; }
  .bp-card { width:100%; max-width:360px; max-height:100%; overflow:auto; background:#fff;
             border-radius:18px; padding:20px 16px; box-shadow:0 12px 40px rgba(0,0,0,.25); }
  .bp-logo { width:56px; height:56px; margin:0 auto 12px; border-radius:18px; background:#34c759;
             display:flex; align-items:center; justify-content:center; }
  .bp-logo svg { width:32px; height:32px; }
  .bp-title { font-size:17px; font-weight:800; text-align:center; color:#141414; }
  .bp-sub { font-size:12px; color:#8a97a5; text-align:center; margin:6px 0 16px; line-height:1.55; }
  .bp-row { display:flex; align-items:center; gap:10px; padding:13px 12px; border-radius:12px;
            cursor:pointer; border:1px solid #e3e7ec; margin-bottom:8px; }
  .bp-row:hover { background:#f2fbf4; border-color:#34c759; }
  .bp-name { font-size:15.5px; font-weight:700; flex:1; min-width:0; color:#141414; }
  .bp-cnt { font-size:12px; color:#8a97a5; font-weight:500; }
  .bp-go { font-size:12px; color:#0a7cff; font-weight:700; white-space:nowrap; }
  .bp-foot { font-size:11px; color:#a8b4c0; text-align:center; margin-top:12px; line-height:1.5; }

  /* PC(마우스 쓰는 넓은 화면): 사이드바 · 대화 편집 · 대화 내용 3단 */
  @media (min-width:1000px) and (pointer:fine){
    #phone { max-width:none; max-height:none; width:100vw; height:100vh; box-shadow:none; }
    body { background:#e9edf0; }
    #listScreen, #roomScreen { max-width:430px; margin:0 auto; width:100%;
      box-shadow:0 0 30px rgba(0,0,0,.12); }   /* 손님 화면은 폰 모양 유지 */
    .admin-body { display:flex; gap:14px; align-items:stretch; overflow:hidden; padding:14px; }
    .apane { overflow-y:auto; min-width:0; padding-right:2px; }
    #paneHome { flex:0 0 320px; }
    #paneThread { flex:0 0 400px; }   /* 대화 목록 + 고른 대화 편집 */
    #paneMsgs { flex:1 1 auto; }
    #adminBody:not(.thread-open) #paneThread,
    #adminBody:not(.thread-open) #paneMsgs,
    #adminBody.thread-open #paneHome { display:block; }
    #backList { display:none; }              /* 3단에서는 목록이 항상 보이므로 불필요 */

    /* 대화 내용을 문자 앱처럼 좌우로 나눠 보여준다 */
    .msg-editor { max-width:86%; }
    .msg-editor.mine { margin-left:auto; }
  }

  /* 누가 보낸 메시지인지 색으로도 구분 */
  .msg-editor.mine { background:#f2f8ff; border-color:#cfe3fb; }
  .msg-editor .who { font-size:11.5px; font-weight:700; color:#8a97a5; margin-bottom:6px; }
  .msg-editor.mine .who { color:#2c6fb5; text-align:right; }

  /* 맨 아래 메시지 추가 줄 */
  .add-row { display:flex; gap:8px; align-items:center; margin-top:12px; }
  .add-row .right { margin-left:auto; }

  .admin-section { background:#fff; border-radius:12px; padding:16px; margin-bottom:14px; }
  .admin-section h3 { font-size:14px; color:#22303c; margin-bottom:12px; font-weight:700;
    display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .admin-section h3 .rsub { font-size:12px; color:#8a97a5; font-weight:600; word-break:break-all; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:12px; color:#6a7580; margin-bottom:5px; font-weight:600; }
  .field input, .field textarea, .field select { width:100%; border:1px solid #d7dde3; border-radius:9px;
    padding:10px 12px; font-size:14px; font-family:inherit; color:#22303c; background:#fff; }
  .field textarea { min-height:64px; resize:vertical; }
  .hint { font-size:12px; color:#8a97a5; line-height:1.6; margin-top:8px; }
  .kv { font-size:12.5px; color:#6a7580; line-height:1.8; word-break:break-all; }
  .kv b { color:#22303c; }
  .btn { border:none; border-radius:9px; padding:10px 14px; font-size:13.5px; font-weight:600;
    cursor:pointer; font-family:inherit; }
  .btn-sm { padding:7px 11px; font-size:12.5px; }
  .btn-block { display:block; width:100%; margin-top:8px; }
  .btn-primary { background:#0a7cff; color:#fff; }
  .btn-ghost { background:#eef1f4; color:#33414d; }
  .btn-danger { background:#ffe6e3; color:#e0402e; }
  .btn-yellow { background:#ffe08a; color:#6b4e00; }
  .row-actions { display:flex; gap:7px; flex-wrap:wrap; }
  .admin-list-item { border:1px solid #e3e7ec; border-radius:10px; padding:11px 12px;
    margin-bottom:10px; background:#fff; }

  /* 끌어서 순서 바꾸기 */
  .sortable .admin-list-item { touch-action:manipulation; }
  .admin-list-item.dragging { opacity:.92; box-shadow:0 8px 20px rgba(0,0,0,.18);
    border-color:#22303c; position:relative; z-index:5; }
  .drag-hint { font-size:11.5px; color:#98a5b2; margin:0 0 8px; }

  /* 폴더 경로 표시 */
  .crumb { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .crumb-txt { font-size:13px; font-weight:700; color:#33414d; word-break:break-all; }
  .crumb-txt .sep { color:#a8b4c0; font-weight:400; margin:0 3px; }
  .node-name { font-weight:700; font-size:14.5px; color:#2a3a4a; cursor:pointer; }
  .node-name .pen { font-size:11px; color:#a8b4c0; margin-left:4px; }

  /* 접었다 펴는 섹션 */
  .admin-section h3.foldable { cursor:pointer; user-select:none; }
  .fold-arrow { font-size:11px; color:#8a97a5; margin-left:6px; }
  .admin-section.folded .fold-body { display:none; }
  .admin-list-item.on { border-color:#22303c; background:#f7f9fb; }
  .admin-list-item .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .admin-list-item .rname { font-weight:700; font-size:14.5px; color:#2a3a4a; }
  .admin-list-item .rsub { font-size:12px; color:#8a97a5; margin-top:2px; word-break:break-all; }
  .me-tag { background:#0a7cff; color:#fff; font-size:10.5px; font-weight:700;
    padding:2px 6px; border-radius:6px; }
  .me-tag.ghost { background:#e5e9ee; color:#6a7580; cursor:pointer; }

  /* 등장인물 한 줄: [사진] 이름 … 참여 대화 / 아랫줄에 버튼 */
  .ppl-row { display:flex; gap:10px; align-items:flex-start; }
  .ppl-body { min-width:0; flex:1; }
  .ppl-head { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .ppl-btns { display:flex; gap:6px; flex-wrap:wrap; margin-top:7px; }
  .ppl-alias { margin-top:8px; }
  .ppl-alias label { display:block; font-size:11.5px; color:#8a97a5; margin-bottom:4px; font-weight:600; }
  .ppl-alias input { width:100%; border:1px solid #d7dde3; border-radius:8px; padding:7px 9px;
    font-size:13px; font-family:inherit; color:#22303c; }

  /* 대화 참여자 줄 */
  .part-row { display:flex; align-items:flex-start; gap:11px; padding:9px 0; border-bottom:1px solid #f0f2f5; }
  .part-row:last-child { border-bottom:none; }
  .part-thumb { width:46px; height:46px; border-radius:50%; flex-shrink:0; overflow:hidden; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:18px; }
  .part-thumb img { width:100%; height:100%; object-fit:cover; }
  .part-info { flex:1; min-width:0; }
  .part-name { font-size:14.5px; font-weight:700; color:#2a3a4a; margin-bottom:6px;
    display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .part-name-input { flex:0 1 auto; min-width:0; width:130px; border:1px solid #d7dde3;
    border-radius:7px; padding:6px 9px; font-size:14px; font-weight:700; color:#2a3a4a; font-family:inherit; }
  .part-actions { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
  .av-edit { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .av-edit .av-prev { width:56px; height:56px; border-radius:50%; overflow:hidden; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:600; color:#fff; }
  .av-edit .av-prev img { width:100%; height:100%; object-fit:cover; }

  .msg-editor { border:1px solid #e3e7ec; border-radius:11px; padding:11px; margin-bottom:11px; background:#fbfcfd; }
  .msg-editor .er1 { display:flex; gap:8px; margin-bottom:8px; }
  .msg-editor .er1 select, .msg-editor .er1 input { border:1px solid #d7dde3; border-radius:8px;
    padding:8px 10px; font-size:13px; font-family:inherit; }
  .msg-editor .er1 .who-sel { width:110px; flex-shrink:0; }
  .msg-editor textarea { width:100%; border:1px solid #d7dde3; border-radius:8px; padding:8px 10px;
    font-size:13.5px; font-family:inherit; min-height:52px; resize:vertical; margin-bottom:8px; }
  .msg-editor .stamp { font-size:11.5px; color:#8a97a5; margin:-2px 0 8px; }
  .msg-editor .er2 { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .msg-editor .er2 label { font-size:12px; color:#5a6570; display:flex; align-items:center; gap:5px; }
  .msg-editor .er2 input[type=text] { flex:1; min-width:90px; border:1px solid #d7dde3; border-radius:8px;
    padding:7px 9px; font-size:12.5px; font-family:inherit; }
  .msg-editor .er3 { display:flex; gap:6px; align-items:center; margin-top:9px; }
  .msg-editor .er3 .spacer { flex:1; }
  .msg-thumb { width:44px; height:44px; border-radius:8px; overflow:hidden; background:#e9edf1; flex-shrink:0; }
  .msg-thumb img { width:100%; height:100%; object-fit:cover; }

  /* ===== 모드 표시 / 토스트 / 확인창 ===== */
  .mode-pill { position:absolute; top:6px; left:50%; transform:translateX(-50%); z-index:60;
    background:#22303c; color:#fff; font-size:11px; padding:4px 12px; border-radius:12px; display:none; }
  .mode-pill.show { display:block; }
  .toast { position:absolute; bottom:80px; left:50%; transform:translateX(-50%); z-index:220;
    background:rgba(20,20,20,.9); color:#fff; font-size:13px; padding:10px 18px; border-radius:22px;
    opacity:0; transition:opacity .25s; pointer-events:none; max-width:80%; text-align:center; }
  .toast.show { opacity:1; }

<script>

  /* 숫자 앞에 0을 붙일 때 쓴다 (시각 표시). 크롬 57 미만에 없음 */
  if(!String.prototype.padStart){
    String.prototype.padStart = function(len, pad){
      var s = String(this);
      pad = (pad === undefined) ? ' ' : String(pad);
      if(s.length >= len || pad === '') return s;
      var fill = '';
      while(fill.length < len - s.length) fill += pad;
      return fill.slice(0, len - s.length) + s;
    };
  }
  if(!String.prototype.padEnd){
    String.prototype.padEnd = function(len, pad){
      var s = String(this);
      pad = (pad === undefined) ? ' ' : String(pad);
      if(s.length >= len || pad === '') return s;
      var fill = '';
      while(fill.length < len - s.length) fill += pad;
      return s + fill.slice(0, len - s.length);
    };
  }

  /* 앱 설치 안내를 닫을 때 쓴다. 크롬 63 미만에 없음 */
  if(window.Promise && !Promise.prototype['finally']){
    Promise.prototype['finally'] = function(cb){
      var P = this.constructor || Promise;
      return this.then(
        function(v){ return P.resolve(cb()).then(function(){ return v; }); },
        function(e){ return P.resolve(cb()).then(function(){ throw e; }); }
      );
    };
  }

  /* 화면 요소를 한꺼번에 훑을 때 쓴다. 크롬 51 미만에 없어서 앱이 멈춘다 */
  ['NodeList','HTMLCollection','DOMTokenList'].forEach(function(n){
    var C = window[n];
    if(C && C.prototype && !C.prototype.forEach){
      C.prototype.forEach = Array.prototype.forEach;
    }
  });

  if(!Object.entries){
    Object.entries = function(o){
      var r = [], k;
      for(k in o){ if(Object.prototype.hasOwnProperty.call(o, k)) r.push([k, o[k]]); }
      return r;
    };
  }
  if(!Object.values){
    Object.values = function(o){
      var r = [], k;
      for(k in o){ if(Object.prototype.hasOwnProperty.call(o, k)) r.push(o[k]); }
      return r;
    };
  }
  if(!Array.prototype.includes){
    Array.prototype.includes = function(v){ return this.indexOf(v) !== -1; };
  }
  if(window.Element && !Element.prototype.closest){
    var m = Element.prototype.matches || Element.prototype.webkitMatchesSelector ||
            Element.prototype.msMatchesSelector;
    Element.prototype.matches = m;
    Element.prototype.closest = function(sel){
      var e = this;
      while(e && e.nodeType === 1){ if(m.call(e, sel)) return e; e = e.parentElement; }
      return null;
    };
  }

  /* ---------- 2. 칸 사이 여백(gap) 대신 여백 직접 계산 ---------- */
  /* 크롬 84 미만에서는 flex 안의 gap이 무시되어 글자·버튼이 다 붙어 보인다.
     그래서 스타일을 훑어 gap이 쓰인 곳을 찾아 바깥여백으로 바꿔 준다. */

  var gapStyle = null;

  function flexGapWorks(){
    var box = document.createElement('div');
    box.style.cssText = 'display:flex;flex-direction:column;row-gap:1px;' +
                        'position:absolute;visibility:hidden;height:0;overflow:visible';
    box.appendChild(document.createElement('div'));
    box.appendChild(document.createElement('div'));
    var host = document.body || document.documentElement;
    host.appendChild(box);
    var ok = box.scrollHeight === 1;
    host.removeChild(box);
    return ok;
  }

  function firstValue(v){
    v = (v || '').trim();
    if(!v || v === 'normal') return '';
    return v.split(/\s+/)[0];
  }
  function secondValue(v){
    v = (v || '').trim();
    if(!v || v === 'normal') return '';
    var p = v.split(/\s+/);
    return p[1] || p[0];
  }

  function collect(rules, out){
    if(!rules) return;
    for(var i = 0; i < rules.length; i++){
      var r = rules[i];
      if(r.cssRules && r.cssRules.length) collect(r.cssRules, out);   /* @media 안쪽까지 */
      if(!r.style || !r.selectorText) continue;
      if(r.style.gridTemplateColumns || r.style.gridTemplateRows) continue;  /* 표 배치는 따로 처리 */
      if((r.style.display || '').indexOf('grid') >= 0) continue;

      var g  = r.style.getPropertyValue('gap');
      var rg = (r.style.getPropertyValue('row-gap')    || firstValue(g)).trim();
      var cg = (r.style.getPropertyValue('column-gap') || secondValue(g)).trim();
      if(rg === 'normal') rg = '';
      if(cg === 'normal') cg = '';
      if(!rg && !cg) continue;

      out.push({ sel: r.selectorText, rg: rg, cg: cg,
                 disp: (r.style.display || '').trim(),
                 dir:  (r.style.flexDirection || '').trim(),
                 wrap: (r.style.flexWrap || '').trim() });
    }
  }

  function buildGapCss(){
    var found = [];
    var sheets = document.styleSheets;
    for(var i = 0; i < sheets.length; i++){
      try { collect(sheets[i].cssRules, found); } catch(e){ /* 읽을 수 없는 스타일은 건너뛴다 */ }
    }

    var css = [];
    for(var k = 0; k < found.length; k++){
      var f = found[k];
      var parts = f.sel.split(',');
      for(var s = 0; s < parts.length; s++){
        var sel = parts[s].trim();
        if(!sel || sel.indexOf('::') >= 0) continue;

        /* 실제 화면에 있는 요소를 보고 가로줄인지 세로줄인지 판단한다 */
        var el = null, cs = null;
        try { el = document.querySelector(sel); } catch(e){ continue; }
        if(el && window.getComputedStyle) cs = window.getComputedStyle(el);

        var disp = f.disp || (cs ? cs.display : '');
        if(disp.indexOf('flex') < 0) continue;          /* flex가 아니면 손대지 않는다 */

        var dir  = f.dir  || (cs ? (cs.flexDirection || 'row') : 'row');
        var wrap = f.wrap || (cs ? (cs.flexWrap || 'nowrap') : 'nowrap');
        var column = dir.indexOf('column') === 0;

        if(wrap.indexOf('wrap') === 0){
          /* 줄바꿈되는 묶음은 모든 칸에 여백을 준다 */
          if(f.cg) css.push(sel + '>*{margin-right:' + f.cg + '}');
          if(f.rg) css.push(sel + '>*{margin-bottom:' + f.rg + '}');
        } else if(column){
          if(f.rg) css.push(sel + '>*+*{margin-top:' + f.rg + '}');
        } else {
          if(f.cg) css.push(sel + '>*+*{margin-left:' + f.cg + '}');
        }
      }
    }

    if(!gapStyle){
      gapStyle = document.createElement('style');
      gapStyle.id = 'oldBrowserGap';
      (document.head || document.documentElement).appendChild(gapStyle);
    }
    gapStyle.textContent = css.join('\n');
  }

  function startGapFix(){
    try {
      if(flexGapWorks()) return;            /* 요즘 기기 — 그대로 둔다 */
      buildGapCss();
      /* 앱이 화면을 다 그린 뒤 한 번 더 — 그때 생긴 부분까지 맞춘다 */
      setTimeout(buildGapCss, 1200);
      setTimeout(buildGapCss, 3000);
    } catch(e){ /* 실패해도 앱은 그대로 쓸 수 있으니 조용히 넘어간다 */ }
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', startGapFix);
  } else {
    startGapFix();
  }
})();
</script>

   사진이 많아지면 localStorage(약 5MB)로는 모자라므로 IndexedDB 를 주 저장소로 쓴다.
   IndexedDB 는 기기 여유 공간에 맞춰 보통 수백 MB 까지 쓸 수 있다. */
const BOOT_ERR_BOX = 'threadList';
const IDB_NAME = 'crimescene_sms';
const IDB_STORE = 'box';
const IDB_KEY = 'main';
let idbState = 'ok';        /* ok | unavailable | error */
let idbBox = null;
let saveBlocked = false;    /* 저장된 내용을 읽지 못했으면 덮어쓰지 않는다 */
let saveWarned = false;
let storeKind = 'localStorage';

function idbOpen(){
  return new Promise((res, rej)=>{
    if(!self.indexedDB){ idbState = 'unavailable'; return rej(new Error('없음')); }
    /* 파일을 직접 열면(file://) IndexedDB 를 쓸 수 없다.
       브라우저에 따라 오류도 나지 않고 응답이 아예 오지 않아 화면이 멈추므로 먼저 걸러낸다. */
    if(location.protocol === 'file:'){ idbState = 'unavailable'; return rej(new Error('파일 직접 열기')); }
    let settled = false;
    const finish = (fn, v)=>{ if(!settled){ settled = true; clearTimeout(timer); fn(v); } };
    const timer = setTimeout(()=>{
      if(!settled){ settled = true; idbState = 'unavailable'; rej(new Error('시간 초과')); }
    }, 2500);
    let rq;
    try{ rq = indexedDB.open(IDB_NAME, 1); }
    catch(e){ idbState = 'unavailable'; return finish(rej, e); }
    rq.onupgradeneeded = ()=>{ try{ rq.result.createObjectStore(IDB_STORE); }catch(e){} };
    rq.onsuccess = ()=>{ idbState = 'ok'; finish(res, rq.result); };
    rq.onerror   = ()=>{ if(idbState !== 'unavailable') idbState = 'error'; finish(rej, rq.error || new Error('열기 실패')); };
    rq.onblocked = ()=>{ idbState = 'unavailable'; finish(rej, new Error('차단됨')); };
  });
}
/* “내용이 없음”과 “읽지 못함”은 완전히 다르다. 섞으면 읽기 실패 한 번에 사진이 날아간다. */
function idbRead(){
  return idbOpen().then(db=> new Promise(res=>{
    let tx;
    try{ tx = db.transaction(IDB_STORE, 'readonly'); }
    catch(e){ return res({ok:false, value:null}); }
    const rq = tx.objectStore(IDB_STORE).get(IDB_KEY);
    rq.onsuccess = ()=> res({ok:true, value:rq.result || null});
    rq.onerror   = ()=> res({ok:false, value:null});
  })).catch(()=> ({ok:false, value:null}));
}
function idbWrite(v){
  return idbOpen().then(db=> new Promise((res, rej)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(v, IDB_KEY);
    tx.oncomplete = ()=> res(true);
    tx.onerror    = ()=> rej(tx.error || new Error('저장 실패'));
    tx.onabort    = ()=> rej(tx.error || new Error('저장 중단'));
  }));
}
function idbClear(){
  return idbOpen().then(db=> new Promise(res=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(IDB_KEY);
    tx.oncomplete = ()=> res(true);
    tx.onerror    = ()=> res(false);
    tx.onabort    = ()=> res(false);
  })).catch(()=> false);
}
let persistState = '확인 중';
function askPersist(){
  try{
    if(!navigator.storage || !navigator.storage.persist){ persistState = '지원 안 함'; return Promise.resolve(); }
    return (navigator.storage.persisted ? navigator.storage.persisted() : Promise.resolve(false))
      .then(p=> p ? true : navigator.storage.persist())
      .then(p=>{ persistState = p ? '켜짐' : '꺼짐'; })
      .catch(()=>{ persistState = '알 수 없음'; });
  }catch(e){ persistState = '알 수 없음'; return Promise.resolve(); }
}
let quotaText = '확인 중';
function refreshQuota(){
  try{
    if(!navigator.storage || !navigator.storage.estimate){ quotaText = '알 수 없음'; return Promise.resolve(); }
    return navigator.storage.estimate().then(e=>{
      const mb = n => (n/1048576).toFixed(n < 104857600 ? 1 : 0) + ' MB';
      quotaText = mb(e.usage||0) + ' 사용 / ' + mb(e.quota||0) + ' 사용 가능';
    }).catch(()=>{ quotaText = '알 수 없음'; });
  }catch(e){ quotaText = '알 수 없음'; return Promise.resolve(); }
}

/* 파일에서 막 읽어온 상태의 지문. 이후 내용이 달라지면 “이 기기에만 저장된 수정”이다 */
let baseFp = null;

function load(){
  return idbRead().then(got=>{
    let box = got.value;
    if(!got.ok && idbState === 'error') saveBlocked = true;
    storeKind = (idbState === 'ok') ? 'IndexedDB' : 'localStorage';
    if(!box){
      try{ box = JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){ box = null; }
    }
    if(box && box.data && box.version === DATA_VERSION && box.fp === DATA_FP){
      idbBox = box;
      baseFp = box.base || null;
      return normalize(box.data);
    }
    if(!saveBlocked) wipeStored();
    const fresh = normalize(deepCopy(EMBEDDED_DATA));
    baseFp = fingerprint(fresh);
    return fresh;
  });
}
function hasLocalEdits(){
  return !!baseFp && fingerprint(data) !== baseFp;
}

function save(){
  try{ (data.lists||[]).forEach(ensurePeople); }catch(e){}
  if(saveBlocked) return true;
  const box = { version: DATA_VERSION, fp: DATA_FP, base: baseFp,
                savedAt: new Date().toISOString(), data: data };
  idbBox = box;
  idbWrite(box).then(()=>{ saveWarned = false; }).catch(()=>{
    if(!saveWarned){ saveWarned = true; toast('저장하지 못했습니다. 내보내기로 백업해 주세요.'); }
  });
  if(storageOK){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(box)); }catch(e){} }
  return true;
}

function storageKB(){
  try{ return Math.round(JSON.stringify({version:DATA_VERSION, data:data}).length/1024); }
  catch(e){ return 0; }
}

/* ---------- 새 파일 자동 감지 (재설치·파일 교체 반영) ----------
   설치된 앱은 캐시로도 열리기 때문에, 실행할 때마다 서버에 놓인 index.html 을
   한 번 확인해서 내용이 다르면 캐시·저장분을 지우고 새 파일로 다시 연다. */
const MARK_S = '/*__CS' + '_DATA_START__';
const MARK_E = '/*__CS' + '_DATA_END__*/';

function readFileData(txt){
  const i = txt.indexOf(MARK_S), j = txt.indexOf(MARK_E);
  if(i < 0 || j <= i) return null;
  try{
    const block = txt.slice(i, j).replace(MARK_S, '/*');
    return (new Function(block + '\nreturn { v: DATA_VERSION, d: EMBEDDED_DATA };'))();
  }catch(e){ return null; }
}

function forceUpdate(){
  const go = ()=> location.replace(listUrl(curList().key));
  const steps = [];
  idbBox = null;
  try{ steps.push(idbClear()); }catch(e){}
  try{ localStorage.removeItem(STORE_KEY); LEGACY_KEYS.forEach(k=>localStorage.removeItem(k)); }catch(e){}
  try{
    if(window.caches && caches.keys){
      steps.push(caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))));
    }
  }catch(e){}
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
      steps.push(navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))));
    }
  }catch(e){}
  Promise.all(steps).then(go, go);
}

function checkForUpdate(manual){
  if(location.protocol.indexOf('http') !== 0){
    if(manual) toast('로컬 서버(localhost)로 열었을 때만 확인할 수 있습니다');
    return;
  }
  fetch('./index.html?_uc=' + Date.now(), {cache:'no-store'})
    .then(r=> r.ok ? r.text() : Promise.reject())
    .then(txt=>{
      const got = readFileData(txt);
      if(!got){ if(manual) toast('파일을 확인할 수 없습니다'); return; }
      const fileFp = fingerprint(got.d);
      const same = (got.v === DATA_VERSION) && (fileFp === DATA_FP);
      const info = document.getElementById('updInfo');
      if(info){
        const lists = (got.d.lists||[]);
        const threads = lists.reduce((a,x)=>a+(x.threads||[]).length,0);
        const msgs = lists.reduce((a,x)=>a+(x.threads||[]).reduce((b,t)=>b+(t.messages||[]).length,0),0);
        info.innerHTML = '서버 파일 버전 <b>' + esc(got.v) + '</b> · 지문 <b>' + esc(fileFp) + '</b><br>'
          + '서버 파일 내용 <b>대화 ' + threads + '개 · 메시지 ' + msgs + '개</b><br>'
          + '판정 <b>' + (same ? '지금 보이는 내용과 같음' : '다름 → 새 내용으로 교체') + '</b>';
      }
      if(same){ if(manual) toast('이미 최신 파일입니다'); return; }
      const tag = got.v + '|' + fileFp;
      let tried = null;
      try{ tried = sessionStorage.getItem('cs_upd'); }catch(e){}
      if(!manual && tried === tag){
        toast('새 파일이 있는데 적용되지 않았습니다. 관리자 모드에서 “새 파일 확인”을 눌러주세요.');
        return;
      }
      try{ sessionStorage.setItem('cs_upd', tag); }catch(e){}
      toast('새 파일을 발견했습니다. 새 내용으로 다시 엽니다…');
      setTimeout(forceUpdate, 700);
    })
    .catch(()=>{ if(manual) toast('서버에 연결할 수 없습니다. 서버 앱이 켜져 있는지 확인하세요.'); });
}

/* 옛 형식(threads 가 최상위)도 그대로 받아들여 새 형식으로 올려준다 */
function normalize(d){
  if(!d) d = {};
  if(!Array.isArray(d.lists)){
    const one = {
      key: '기본',
      title: d.listTitle || '메시지',
      appName: '',
      bottomPad: Number(d.bottomPad)||0,
      threads: Array.isArray(d.threads) ? d.threads : (Array.isArray(d.rooms) ? d.rooms : [])
    };
    d = { appName: d.appName || '메시지', lists: [one] };
  }
  if(!d.appName) d.appName = '메시지';
  /* 저장된 내용에 빈(null) 항목이 섞여 있어도 앱이 멈추지 않게 먼저 걸러낸다 */
  d.lists = d.lists.filter(L=> L && typeof L === 'object');
  if(Array.isArray(d.tree)){
    d.tree = d.tree.filter(c1=> c1 && typeof c1 === 'object');
    d.tree.forEach(c1=>{
      if(Array.isArray(c1.children)) c1.children = c1.children.filter(c2=> c2 && typeof c2 === 'object');
    });
  }
  if(!d.lists.length) d.lists = [{ key:'기본', label:'', title:'메시지', bottomPad:0, threads:[] }];

  const usedKeys = [];
  d.lists.forEach((L, i)=>{
    L.title = L.title || '메시지';
    if(L.label === undefined) L.label = '';     /* 소분류 표시 이름 (비면 주소용 이름 사용) */
    delete L.appName;                            /* 목록별 앱 이름은 쓰지 않는다 (m/ 매니페스트로 대체) */
    L.bottomPad = Math.max(0, Number(L.bottomPad)||0);
    if(!Array.isArray(L.threads)) L.threads = Array.isArray(L.rooms) ? L.rooms : [];
    L.threads = L.threads.filter(t=> t && typeof t === 'object');
    if(Array.isArray(L.people)) L.people = L.people.filter(p=> p && typeof p === 'object');
    delete L.rooms;
    let k = String(L.key || L.title || ('목록'+(i+1))).trim() || ('목록'+(i+1));
    while(usedKeys.indexOf(normKey(k)) !== -1) k = k + '_2';
    usedKeys.push(normKey(k));
    L.key = k;

    if(!Array.isArray(L.people)) L.people = [];
    if(L.alias && typeof L.alias !== 'object') L.alias = {};

    L.threads.forEach(th=>{
      if(!th.id) th.id = id();
      if(!Array.isArray(th.messages)) th.messages = [];

      /* ── 옛 형식 올려주기 ──
         예전에는 대화마다 상대 이름·번호·사진을 따로 저장하고 메시지에 mine(보냄/받음)을 적었다.
         이제는 이름을 인물 명단에 한 번만 두고, 메시지에는 보낸 사람 이름을 적는다. */
      if(!Array.isArray(th.participants)){
        const meName = String(d.meName || '나').trim() || '나';
        const otherName = String(th.name || '상대방').trim() || '상대방';
        th.participants = [
          { id:id(), name:meName, sub:'', avatar:'', silo:0 },
          { id:id(), name:otherName, sub:th.sub||'', avatar:th.avatar||'', silo:1 }
        ];
        th.messages.forEach(m=>{ m.senderName = m.mine ? meName : otherName; });
        if(typeof th.listUnread === 'number' && th.listUnread >= 0){
          th.per = th.per || {};
          th.per[personId(meName)] = { unread: th.listUnread };
        }
        th.migratedFrom = undefined;
      }
      delete th.name; delete th.sub; delete th.avatar; delete th.listUnread; delete th.migratedFrom;
      th.participants = th.participants.filter(p=> p && typeof p === 'object');
      if(Array.isArray(th.messages)) th.messages = th.messages.filter(m=> m && typeof m === 'object');

      let c = 0;
      th.participants.forEach(p=>{
        if(!p.id) p.id = id();
        if(p.name === undefined) p.name = '';
        if(p.sub === undefined) p.sub = '';
        if(p.avatar === undefined) p.avatar = '';
        if(p.silo === undefined || p.silo === null) p.silo = c % 2;
        delete p.isMe;                 /* “나”는 저장하지 않고 폰에서 고른 사람으로 계산한다 */
        c++;
      });
      th.isGroup = (th.isGroup !== undefined) ? !!th.isGroup : (th.participants.length > 2);
      if(!Array.isArray(th.only)) th.only = [];
      if(!th.per || typeof th.per !== 'object') th.per = {};

      th.messages.forEach(m=>{
        if(!m.id) m.id = id();
        if(m.senderName === undefined){
          const first = th.participants[0], second = th.participants[1] || first;
          m.senderName = m.mine ? (first ? first.name : '나') : (second ? second.name : '');
        }
        delete m.mine;
        if(m.text === undefined) m.text = '';
        if(m.image === undefined) m.image = '';
        if(m.time === undefined) m.time = '';
        if(m.date === undefined) m.date = '';
        if(m.status === undefined) m.status = '';
        if(m.unread !== undefined) delete m.unread;
      });
    });
  });
  const keep = data;
  data = d;                 /* ensureTree · ensurePeople 안에서 쓰는 도우미들이 data 를 참조한다 */
  try{ ensureTree(d); } catch(e){}
  data = keep;
  try{ unifyCategories(d); } catch(e){}
  try{ (d.lists||[]).forEach(ensurePeople); } catch(e){}   /* 사진을 인물 명단으로 모아 중복 제거 */   /* 중분류 하나 = 문자 앱 한 벌 */
  data = d;
  try{ d.lists.forEach(L=>ensurePeople(L)); } catch(e){}
  data = keep;
  return d;
}

function id(){ return 'x'+Math.random().toString(36).slice(2,9); }

/* ---------- 대화 목록(세트) ---------- */
function normKey(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,'_'); }
function curList(){ return data.lists[listIdx] || data.lists[0]; }

/* ============================================================
   인물 · 이 기기에서 볼 “나”
   목록 하나 = 사건 하나 = 문자 앱 한 벌.
   대화 내용은 목록에 한 번만 쓰고, 폰마다 “나”만 고르면 그 사람의 문자 앱이 된다.
   손님 화면에는 “나”가 참여한 대화만 보인다.
   ============================================================ */
/* ---------- 이 폰의 지점 잠금 ----------
   폰 한 대는 한 지점만 본다. 처음 실행할 때 고르고, 그 뒤에는 바꿀 수 없다.
   다른 지점 내용은 화면에 아예 나오지 않아 스포일러를 막는다.
   (바꿔야 하면 주소 끝에 ?reset=1 을 붙여 이 기기 설정을 초기화한다) */
const BRANCH_KEY = 'crimescene_sms_branch';
let branchLock = null;              /* {id, name} — 기기마다 따로 저장된다 */
function loadBranch(){
  try{ const v = JSON.parse(localStorage.getItem(BRANCH_KEY)); branchLock = (v && typeof v === 'object') ? v : null; }
  catch(e){ branchLock = null; }
}
function saveBranch(){
  try{
    if(branchLock) localStorage.setItem(BRANCH_KEY, JSON.stringify(branchLock));
    else localStorage.removeItem(BRANCH_KEY);
  }catch(e){}
}
function lockedC1(){
  if(!branchLock || !data) return null;
  const byId = (data.tree||[]).find(c=>c.id === branchLock.id);
  if(byId){
    if(branchLock.name !== byId.name){ branchLock.name = byId.name; saveBranch(); }
    return byId;
  }
  const byName = (data.tree||[]).find(c=>c.name === branchLock.name);
  if(byName){ branchLock = {id:byName.id, name:byName.name}; saveBranch(); return byName; }
  return null;
}
/* PC(편집용)에서는 잠그지 않는다 — 제작자는 전체를 봐야 한다 */
function branchLocked(){ return !wideAdmin() && !!lockedC1(); }
function setBranch(c1){ branchLock = {id:c1.id, name:c1.name}; saveBranch(); }
function listAllowed(L){
  const lk = branchLocked() ? lockedC1() : null;
  if(!lk || !L) return true;
  const c = catOfList(L.key);
  return !!(c && c.c1.id === lk.id);
}
function fixListForBranch(){
  const lk = branchLocked() ? lockedC1() : null;
  if(!lk || listAllowed(curList())) return;
  const keys = [];
  (lk.children||[]).forEach(c2=> (c2.lists||[]).forEach(k=> keys.push(k)));
  for(const k of keys){ const i = findListIdx(k); if(i >= 0){ listIdx = i; return; } }
}
/* 지금 목록에 이 폰의 “나”가 없을 때, 볼 수 있는 다른 목록 중에 “나”가 정해진 곳을 찾아 옮긴다.
   테마가 둘 이상인 지점에서 앱을 껐다 켜면 첫 테마로 돌아가 손님 모드가 풀리던 것을 막는다 */
function fixListForMe(){
  if(meId()) return;
  const back = listIdx;
  for(let i = 0; i < data.lists.length; i++){
    const L = data.lists[i];
    if(!L || !viewAs[L.key] || !listAllowed(L)) continue;
    listIdx = i;
    if(meId()){ rememberList(); return; }
  }
  listIdx = back;                      /* 못 찾았으면 원래 보던 목록으로 되돌린다 */
}
function enforceBranchLock(){
  const lk = branchLocked() ? lockedC1() : null;
  if(!lk) return;
  if(treePath[0] !== lk.id){ treePath = [lk.id]; adminListPicked = false; adminThreadId = ''; }
}
function treeMinDepth(){ return branchLocked() ? 1 : 0; }

const VIEW_KEY = 'crimescene_sms_me';
let viewAs = {};                    /* {목록키: {id,name}} — 기기마다 따로 저장된다 */
function loadView(){
  try{ const v = JSON.parse(localStorage.getItem(VIEW_KEY)); viewAs = (v && typeof v === 'object') ? v : {}; }
  catch(e){ viewAs = {}; }
}
function saveView(){ try{ localStorage.setItem(VIEW_KEY, JSON.stringify(viewAs)); }catch(e){} }

/* 인물 id 는 이름에서 만들어 어느 기기에서 만들어도 같게 한다
   (파일을 새로 받아도 폰에 고른 “나”가 그대로 유지되도록) */
function personId(name){
  const s = normKey(name);
  let h = 0x811c9dc5;
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = (h * 0x01000193) >>> 0; }
  return 'p' + h.toString(36);
}
/* 새 인물의 id — 이름에서 만들되, 이미 쓰는 id 면 뒤에 번호를 붙여 겹치지 않게 한다.
   (이름을 바꾼 인물의 id 는 예전 이름으로 만들어져 있어, 같은 이름을 다시 쓰면 겹칠 수 있다) */
function newPersonId(L, name){
  const base = personId(name);
  const used = ((L && L.people) || []).map(p=>p && p.id);
  let pid = base, n = 2;
  while(used.indexOf(pid) !== -1){ pid = base + '_' + (n++); }
  return pid;
}
/* 목록 안의 모든 참여자를 인물 명단으로 모은다 (이름 기준, id 는 한번 정해지면 유지) */
function ensurePeople(L){
  if(!L) return [];
  if(!Array.isArray(L.people)) L.people = [];
  /* 어쩌다 빈 항목이 섞여 들어가도 앱이 멈추지 않게 걸러낸다.
     배열을 새로 만들지 않고 그 자리에서 지운다 — 새로 넣은 인물이 사라지지 않게 하기 위함 */
  for(let i = L.people.length - 1; i >= 0; i--){
    if(!L.people[i] || typeof L.people[i] !== 'object') L.people.splice(i, 1);
  }
  const byName = {};
  const seenId = {};
  L.people.forEach(p=>{
    if(!p.id) p.id = personId(p.name);
    /* 예전 파일에서 생긴 “같은 id 두 사람” 을 고친다 (뒤에 있는 사람에게 새 id 를 준다) */
    if(seenId[p.id]){
      const base = personId(p.name);
      let pid = base, n = 2;
      while(seenId[pid] || L.people.some(x=>x !== p && x && x.id === pid)){ pid = base + '_' + (n++); }
      p.id = pid;
    }
    seenId[p.id] = 1;
    if(p.avatar === undefined) p.avatar = '';
    if(p.sub === undefined) p.sub = '';
    if(p.silo === undefined) p.silo = 0;
    byName[normKey(p.name)] = p;
  });
  (L.threads||[]).forEach(t=> (t.participants||[]).forEach(pt=>{
    const k = normKey(pt.name);
    if(!k) return;
    let p = byName[k];
    if(!p){
      let pid = personId(pt.name), n = 2;
      while(L.people.some(x=>x.id === pid)){ pid = personId(pt.name) + '_' + (n++); }
      p = {id:pid, name:pt.name, sub:pt.sub||'', avatar:pt.avatar||'', silo:pt.silo||0};
      byName[k] = p; L.people.push(p);
    }
    if(!p.avatar && pt.avatar) p.avatar = pt.avatar;
    if(!p.sub && pt.sub) p.sub = pt.sub;
    /* 사진은 인물 명단에 한 장만 둔다.
       같은 사람이 여러 대화에 있어도 사진이 복사되지 않아 저장 공간이 크게 줄어든다. */
    if(pt.avatar !== undefined) delete pt.avatar;
    if(pt.silo !== undefined) delete pt.silo;
  }));
  return L.people;
}
function peopleOf(L){ return ensurePeople(L || curList()); }
/* 찾기만 할 때는 명단을 다시 훑지 않는다 (화면을 그릴 때 자주 불린다) */
function personById(L, pid){
  const ps = (L && L.people) || [];
  return pid ? (ps.find(p=>p && p.id===pid) || null) : null;
}
function personByName(L, name){
  const k = normKey(name);
  const ps = (L && L.people) || [];
  return k ? (ps.find(p=>p && normKey(p.name)===k) || null) : null;
}
/* 참여자의 얼굴(사진·색)은 인물 명단에서 가져온다 */
function faceOf(p){
  if(!p) return { name:'', avatar:'', silo:0, sub:'' };
  const L = curList();
  const per = L ? personByName(L, p.name) : null;
  return per || p;
}
/* 이 기기에서 고른 “나”. id 로 먼저 찾고, 못 찾으면 이름으로 찾아 고쳐 둔다 */
function meId(){
  const L = curList(); if(!L) return '';
  const v = viewAs[L.key];
  if(!v) return '';
  const want = (typeof v === 'string') ? {id:v, name:''} : v;
  const ps = peopleOf(L);
  let p = want.id ? ps.find(x=>x.id === want.id) : null;
  if(!p && want.name) p = ps.find(x=>normKey(x.name) === normKey(want.name));
  if(!p){ delete viewAs[L.key]; saveView(); return ''; }
  if(typeof v === 'string' || v.id !== p.id || v.name !== p.name){
    viewAs[L.key] = {id:p.id, name:p.name}; saveView();
  }
  return p.id;
}
function mePerson(){ return personById(curList(), meId()); }
function setMe(pid){
  const L = curList(); if(!L) return;
  const p = pid ? personById(L, pid) : null;
  if(p) viewAs[L.key] = {id:p.id, name:p.name};
  else delete viewAs[L.key];
  saveView(); applyMeFlags();
}
/* 관리자 화면에서는 “나”를 아직 안 골랐어도 첫 인물 기준으로 보여준다 */
function effMeId(){
  const m = meId();
  if(m) return m;
  if(!isAdmin) return '';
  const ps = peopleOf(curList());
  return ps.length ? ps[0].id : '';
}
/* 참여자의 isMe 는 저장하지 않고, 고른 “나”에 맞춰 그때그때 계산한다 */
function applyMeFlags(){
  const L = curList(); if(!L) return;
  const me = personById(L, effMeId());
  const k = me ? normKey(me.name) : '';
  (L.threads||[]).forEach(t=> (t.participants||[]).forEach(p=>{
    try{
      Object.defineProperty(p, 'isMe', {
        value: (!!k && normKey(p.name) === k), enumerable:false, configurable:true, writable:true
      });
    }catch(e){ p.isMe = !!k && normKey(p.name) === k; }
  }));
}
function inThread(th, name){
  const k = normKey(name);
  return !!k && (th.participants||[]).some(p=>normKey(p.name) === k);
}
/* 기본은 참여자 모두의 폰에 보인다.
   th.only 에 사람을 지정하면 그 사람 폰에만 보인다 */
function visibleTo(th, pid){
  const only = th && th.only;
  if(!Array.isArray(only) || !only.length) return true;
  return only.indexOf(pid) >= 0;
}
/* 손님 화면에 보이는 대화 = 고른 “나”가 참여한 대화 */
function visibleThreads(L){
  const me = personById(L, effMeId());
  if(!me) return [];
  return (L.threads||[]).filter(t=> inThread(t, me.name) && visibleTo(t, me.id));
}
function threadsOfPerson(L, pid){
  const p = personById(L, pid);
  if(!p) return [];
  return (L.threads||[]).filter(t=> inThread(t, p.name) && visibleTo(t, p.id));
}
/* 관리자 목록에 쓰는 대화 이름 (참여자 두 사람을 모두 보여준다) */
function threadLabel(th){
  if(!th) return '';
  const ns = (th.participants||[]).map(p=>p.name).filter(Boolean);
  return ns.length ? ns.join(' ↔ ') : '대화';
}

/* ---------- 폰마다 다르게 부르는 이름 ----------
   L.alias = { 보는사람id: { 상대id: '부를 이름' } }
   내용(대화·메시지)은 실제 이름 그대로 두고, 화면에 그릴 때만 바꿔 보여준다. */
function aliasMap(L, viewerId){
  if(!L || !viewerId) return {};
  return (L.alias && L.alias[viewerId]) || {};
}
function setAlias(L, viewerId, targetId, name){
  if(!L || !viewerId || !targetId) return;
  if(!L.alias) L.alias = {};
  if(!L.alias[viewerId]) L.alias[viewerId] = {};
  const v = String(name||'').trim();
  if(v) L.alias[viewerId][targetId] = v;
  else delete L.alias[viewerId][targetId];
  if(!Object.keys(L.alias[viewerId]).length) delete L.alias[viewerId];
}
/* 손님 화면에 보일 이름 (관리자 편집 화면에서는 실제 이름을 그대로 쓴다) */
function dispName(name){
  const L = curList(); if(!L) return name;
  const vid = effMeId(); if(!vid) return name;
  const p = personByName(L, name); if(!p) return name;
  const a = aliasMap(L, vid)[p.id];
  return (a && a.trim()) ? a.trim() : name;
}

/* 사진·번호는 인물 명단에만 있으므로 따로 퍼뜨릴 것이 없다.
   (예전 파일에서 참여자에 남아 있던 사진만 정리한다) */
function spreadPerson(L, p){
  const k = normKey(p.name);
  (L.threads||[]).forEach(t=> (t.participants||[]).forEach(x=>{
    if(normKey(x.name) === k){ delete x.avatar; delete x.silo; delete x.sub; }
  }));
}
/* 인물 이름 바꾸기 — 모든 대화의 참여자와 메시지 발신자까지 함께 바꾼다 */
function renamePerson(L, p, newName){
  const nn = String(newName||'').trim();
  if(!nn || nn === p.name) return false;
  const dup = peopleOf(L).find(x=> x !== p && normKey(x.name) === normKey(nn));
  const old = normKey(p.name);
  (L.threads||[]).forEach(t=>{
    (t.participants||[]).forEach(x=>{ if(normKey(x.name) === old) x.name = nn; });
    (t.messages||[]).forEach(m=>{ if(normKey(m.senderName) === old) m.senderName = nn; });
  });
  p.name = nn;
  if(dup){
    /* 같은 이름이 이미 있으면 한 사람으로 합친다 */
    (L.threads||[]).forEach(t=>{
      const seen = {};
      t.participants = (t.participants||[]).filter(x=>{
        const kk = normKey(x.name);
        if(seen[kk]) return false;
        seen[kk] = 1; return true;
      });
      if(t.per && t.per[dup.id]){
        t.per[p.id] = Object.assign({}, t.per[dup.id], t.per[p.id]||{});
        delete t.per[dup.id];
      }
      if(Array.isArray(t.only)){
        t.only = t.only.map(x=> x === dup.id ? p.id : x).filter((x,i,a)=>a.indexOf(x)===i);
      }
    });
    const v = viewAs[L.key];
    if(v && ((typeof v === 'string' ? v : v.id) === dup.id)) viewAs[L.key] = {id:p.id, name:p.name};
    if(L.alias){
      if(L.alias[dup.id]){ L.alias[p.id] = Object.assign({}, L.alias[dup.id], L.alias[p.id]||{}); delete L.alias[dup.id]; }
      Object.keys(L.alias).forEach(vw=>{
        if(L.alias[vw][dup.id] !== undefined && L.alias[vw][p.id] === undefined) L.alias[vw][p.id] = L.alias[vw][dup.id];
        delete L.alias[vw][dup.id];
      });
    }
    L.people = L.people.filter(x=> x !== dup);
    saveView();
  }
  spreadPerson(L, p);
  applyMeFlags();
  return true;
}

/* ---------- 대화 설정은 사람마다 따로 (안읽음 · 고정) ---------- */
function perOf(th, pid){
  if(!th || !pid) return {};
  return (th.per && th.per[pid]) ? th.per[pid] : {};
}
function perSet(th, pid, key, val){
  if(!th || !pid) return;
  if(!th.per) th.per = {};
  if(!th.per[pid]) th.per[pid] = {};
  th.per[pid][key] = val;
}
function threadPinned(th){ return !!perOf(th, effMeId()).pinned; }

/* ---------- 분류(폴더) 트리 — 관리자 정리용, 손님 화면에는 영향 없음 ----------
   data.tree = [ { id, name(대분류), children:[ { id, name(중분류), lists:[목록 주소이름…] } ] } ] */
function sanitizeKey(s){
  return String(s||'').trim().replace(/\s+/g,'_').replace(/[?&#%\/\\]/g,'');
}
function makeListKey(c1name, c2name, label, self){
  const base = [c1name, c2name, label].map(sanitizeKey).filter(Boolean).join('_') || '목록';
  let k = base, n = 2;
  while(data.lists.some(L=>L!==self && normKey(L.key)===normKey(k))){ k = base + '_' + n; n++; }
  return k;
}
function listByKey(key){
  const n = normKey(key);
  return data.lists.find(L=>normKey(L.key)===n) || null;
}
function listsOfCat(c2){
  return (c2.lists||[]).map(k=>listByKey(k)).filter(Boolean);
}
function catOfList(key){
  const n = normKey(key);
  for(const c1 of data.tree){
    for(const c2 of c1.children){
      if((c2.lists||[]).some(k=>normKey(k)===n)) return { c1:c1, c2:c2 };
    }
  }
  return null;
}
function treeRemoveList(key){
  const n = normKey(key);
  data.tree.forEach(c1=>c1.children.forEach(c2=>{
    c2.lists = (c2.lists||[]).filter(k=>normKey(k)!==n);
  }));
}
function treeRenameListKey(oldKey, newKey){
  const n = normKey(oldKey);
  data.tree.forEach(c1=>c1.children.forEach(c2=>{
    c2.lists = (c2.lists||[]).map(k=> normKey(k)===n ? newKey : k);
  }));
}
function countInCat1(c1){
  let threads = 0;
  (c1.children||[]).forEach(c2=> listsOfCat(c2).forEach(L=> threads += (L.threads||[]).length));
  return { subs:(c1.children||[]).length, threads:threads };
}
/* 중분류(테마) 하나에 문자 앱 한 벌 — 없으면 만들어 준다 */
function listOfCat(c1, c2){
  const have = listsOfCat(c2);
  if(have.length) return have[0];
  const L = { key: makeListKey(c1.name, c2.name, '', null), label:c2.name, title:'메시지',
              bottomPad:0, threads:[], people:[], unified:true };
  data.lists.push(L);
  c2.lists = [L.key];
  return L;
}
/* 중분류 하나 = 문자 앱 한 벌.
   예전에 중분류 안에 여러 목록을 두던 방식은 하나로 합친다. */
function unifyCategories(d){
  const keep = data;
  data = d;
  try{
    (d.tree||[]).forEach(c1=> (c1.children||[]).forEach(c2=>{
      const members = (c2.lists||[])
        .map(k=> d.lists.find(L=>normKey(L.key)===normKey(k)))
        .filter(Boolean);
      if(!members.length){ listOfCat(c1, c2); return; }
      const target = members[0];
      /* 나머지 목록의 대화·인물·별명을 첫 목록으로 옮긴다 */
      members.slice(1).forEach(L=>{
        ensurePeople(L);
        (L.people||[]).forEach(p=>{
          const has = (target.people||[]).some(x=>normKey(x.name) === normKey(p.name));
          if(!has) target.people.push(p);
        });
        (L.threads||[]).forEach(t=> target.threads.push(t));
        if(L.alias) target.alias = Object.assign({}, L.alias, target.alias||{});
        d.lists = d.lists.filter(x=>x !== L);
      });
      target.label = c2.name;
      target.unified = true;
      c2.lists = [target.key];
      ensurePeople(target);
    }));
  }catch(e){}
  data = keep;
}
/* 트리 정리 + 옛 데이터 올려주기 */
function ensureTree(d){
  if(!Array.isArray(d.tree)) d.tree = [];
  d.tree = d.tree.filter(c1=>c1 && typeof c1 === 'object');
  d.tree.forEach(c1=>{
    if(!c1.id) c1.id = id();
    c1.name = String(c1.name || '분류');
    if(!Array.isArray(c1.children)) c1.children = [];
    c1.children.forEach(c2=>{
      if(!c2.id) c2.id = id();
      c2.name = String(c2.name || '분류');
      if(!Array.isArray(c2.lists)) c2.lists = [];
    });
  });
  /* 트리에 들어있지 않은 목록 찾기 */
  const inTree = {};
  d.tree.forEach(c1=>c1.children.forEach(c2=>c2.lists.forEach(k=>{ inTree[normKey(k)] = true; })));
  const orphans = d.lists.filter(L=>!inTree[normKey(L.key)]);
  if(!orphans.length){
    /* 없어진 목록을 가리키는 항목 정리 */
    d.tree.forEach(c1=>c1.children.forEach(c2=>{
      c2.lists = c2.lists.filter(k=>d.lists.some(L=>normKey(L.key)===normKey(k)));
    }));
    return;
  }
  let target;
  if(!d.tree.length){
    /* 처음 분류를 도입할 때: 기존 목록을 “강남1호점 > 폐가” 아래로 넣는다 */
    const c2 = { id:id(), name:'폐가', lists:[] };
    d.tree.push({ id:id(), name:'강남1호점', children:[c2] });
    target = { c1:d.tree[0], c2:c2 };
  } else {
    let c1 = d.tree.find(c=>c.name === '미분류');
    if(!c1){ c1 = { id:id(), name:'미분류', children:[] }; d.tree.push(c1); }
    let c2 = c1.children[0];
    if(!c2){ c2 = { id:id(), name:'미분류', lists:[] }; c1.children.push(c2); }
    target = { c1:c1, c2:c2 };
  }
  orphans.forEach(L=>{
    if(L.label === undefined || L.label === ''){
      const p = normKey(target.c2.name) + '_';
      L.label = (normKey(L.key).indexOf(p) === 0) ? L.key.slice(target.c2.name.length + 1) : L.key;
    }
    const newKey = makeListKey(target.c1.name, target.c2.name, L.label, L);
    if(normKey(newKey) !== normKey(L.key)) L.key = newKey;
    target.c2.lists.push(L.key);
  });
  d.tree.forEach(c1=>c1.children.forEach(c2=>{
    c2.lists = c2.lists.filter(k=>d.lists.some(L=>normKey(L.key)===normKey(k)));
  }));
}

function requestedListKey(){
  try{
    const u = new URL(location.href);
    let k = u.searchParams.get('list') || u.searchParams.get('l') || '';
    if(!k && location.hash) k = decodeURIComponent(location.hash.slice(1));
    return k || '';
  }catch(e){ return ''; }
}
function findListIdx(key){
  const n = normKey(key);
  if(!n) return -1;
  return data.lists.findIndex(L=>normKey(L.key)===n);
}
/* 마지막으로 본 목록을 기억해 둔다 (설치된 앱을 다시 켤 때 그 목록으로 시작) */
const LAST_KEY = 'crimescene_sms_last_list';
function isStandalone(){
  try{
    return (window.matchMedia && (window.matchMedia('(display-mode: standalone)').matches
                               || window.matchMedia('(display-mode: fullscreen)').matches
                               || window.matchMedia('(display-mode: minimal-ui)').matches))
           || navigator.standalone === true;
  }catch(e){ return false; }
}
function rememberList(){
  try{ localStorage.setItem(LAST_KEY, curList().key); }catch(e){}
}
function savedListKey(){
  try{ return localStorage.getItem(LAST_KEY) || ''; }catch(e){ return ''; }
}
function selectListFromUrl(){
  const key = requestedListKey();
  const saved = savedListKey();
  /* 홈 화면 아이콘으로 실행한 경우에는 마지막으로 본 목록이 우선,
     주소창으로 들어온 경우에는 주소에 적은 목록이 우선 */
  const wanted = (isStandalone() && saved) ? saved : (key || saved);
  if(!wanted) return;
  const i = findListIdx(wanted);
  if(i >= 0){ listIdx = i; return; }
  if(key) setTimeout(()=>toast('“'+key+'” 목록을 찾지 못해 기본 목록을 엽니다'), 400);
}
function syncUrl(){
  try{
    const u = new URL(location.href);
    u.searchParams.set('list', curList().key);
    u.searchParams.delete('reset');
    u.hash = '';
    history.replaceState(history.state, '', u.pathname + u.search);
  }catch(e){}
}
function listUrl(key){
  try{
    const u = new URL(location.href);
    u.searchParams.set('list', key);
    u.hash = '';
    return u.pathname + u.search;
  }catch(e){ return '?list=' + encodeURIComponent(key); }
}

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2000);
}
/* 파일/오프라인에서도 동작하는 자체 확인창 */
function confirmDialog(message, onYes, yesLabel){
  const box = $('#confirmBox');
  $('#confirmMsg').textContent = message;
  box.classList.add('show');
  const yes = $('#confirmYes'), no = $('#confirmNo');

function findThread(tid){ return curList().threads.find(t=>t.id===tid); }

/* 번호처럼 보이거나 발신제한 등 이름이 아닌 항목은 회색 실루엣으로 */
function isNumberish(name){
  const n = (name||'').trim();
  if(!n) return true;
  if(/제한|수신|스팸|알림|Web/i.test(n)) return true;
  return /^[\d\s\-+()]+$/.test(n);
}
function avColor(name){
  let h=0; for(const c of (name||'?')) h = (h*31 + c.charCodeAt(0))>>>0;
  return AV_COLORS[h % AV_COLORS.length];
}
function silhouetteSVG(){
  return `<svg viewBox="0 0 100 100" style="width:100%;height:100%;display:block" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#c3c9d0"/>
    <circle cx="50" cy="40" r="16" fill="#f4f6f8"/>
    <path d="M50 60c-18 0-30 13-32 34h64c-2-21-14-34-32-34z" fill="#f4f6f8"/>
  </svg>`;
}
/* 아바타 HTML: 사진 있으면 사진 / 번호류면 실루엣 / 이름이면 색+첫글자
   (인물·참여자 모두 {name, avatar} 를 가지므로 그대로 쓸 수 있다) */
function avatarInner(p){
  if(!p) return silhouetteSVG();
  const f = faceOf(p);
  if(f.avatar) return `<img src="${f.avatar}">`;
  if(isNumberish(p.name)) return silhouetteSVG();
  return esc((dispName(p.name)||'?').trim().charAt(0));
}
function avatarStyle(p){
  if(!p) return 'background:#e3e7ec';
  if(faceOf(p).avatar || isNumberish(p.name)) return 'background:#e3e7ec';
  return `background:${avColor(p.name)}`;
}
/* 대화에서 “나”가 아닌 사람들 / 대표 상대 */
function othersOf(th){

}
function mainOther(th){ return othersOf(th)[0] || null; }
/* 손님 화면에 보이는 대화 제목 (상대 이름, 여러 명이면 쉼표로) */

/* 상단 이름 아래 회색 글씨 (번호·부제) — 1:1 일 때만 */

/* ---------- 날짜 / 시간 입력 변환 ---------- */
/* 20260504 → 2026-05-04, 2026.5.4 / 26-5-4 / 0504 도 인식 */
function parseDateInput(v){
  const s = String(v||'').trim();
  if(!s) return '';
  const nums = s.match(/\d+/g);
  if(!nums) return null;
  const digits = nums.join('');
  let y, mo, da;
  if(nums.length >= 3){ y = +nums[0]; mo = +nums[1]; da = +nums[2]; }
  else if(digits.length === 8){ y = +digits.slice(0,4); mo = +digits.slice(4,6); da = +digits.slice(6,8); }
  else if(digits.length === 6){ y = 2000 + (+digits.slice(0,2)); mo = +digits.slice(2,4); da = +digits.slice(4,6); }
  else if(nums.length === 2){ y = new Date().getFullYear(); mo = +nums[0]; da = +nums[1]; }
  else if(digits.length === 4){ y = new Date().getFullYear(); mo = +digits.slice(0,2); da = +digits.slice(2,4); }
  else return null;
  if(y < 100) y += 2000;
  if(!(mo>=1 && mo<=12) || !(da>=1 && da<=31)) return null;
  const d = new Date(y, mo-1, da);
  if(d.getFullYear()!==y || d.getMonth()!==mo-1 || d.getDate()!==da) return null;
  return `${y}-${String(mo).padStart(2,'0')}-${String(da).padStart(2,'0')}`;
}
/* 1450 → 오후 2:50, 930 → 오전 9:30, "오후 2:50" 은 그대로 */
function parseTimeInput(v){
  const s = String(v||'').trim();
  if(!s) return '';
  let ampm = '';
  if(/오전|AM|am|Am/.test(s)) ampm = '오전';
  if(/오후|PM|pm|Pm/.test(s)) ampm = '오후';
  const nums = s.replace(/[^\d]/g,'');
  if(!nums) return null;
  let h, mi;
  if(nums.length <= 2){ h = +nums; mi = 0; }
  else if(nums.length === 3){ h = +nums.slice(0,1); mi = +nums.slice(1); }
  else if(nums.length === 4){ h = +nums.slice(0,2); mi = +nums.slice(2); }
  else return null;
  if(mi > 59) return null;
  if(ampm){
    if(h < 1 || h > 12) return null;
  } else {
    if(h > 23) return null;
    ampm = h < 12 ? '오전' : '오후';
    h = (h % 12) || 12;
  }
  return `${ampm} ${h}:${String(mi).padStart(2,'0')}`;
}
function formatKoreanDate(iso){
  if(!iso) return '';
  const p = String(iso).split('-');
  if(p.length!==3) return iso;
  const y=+p[0], mo=+p[1], da=+p[2];
  const dObj = new Date(y, mo-1, da);
  if(isNaN(dObj)) return iso;
  const wd = ['일','월','화','수','목','금','토'][dObj.getDay()];
  return `${y}년 ${mo}월 ${da}일 ${wd}요일`;
}

/* ---------- 안 읽음 개수 ---------- */
/* 내가 마지막으로 보낸 시점 이후에 상대가 보낸 메시지 개수.
   마지막 메시지가 보낸 메시지(내 메시지)면 0이 되고,
   내가 한 번도 보낸 적이 없으면 받은 메시지 전체 개수. */
function autoUnreadFor(th, pid){
  const p = personById(curList(), pid);
  if(!p) return 0;
  const k = normKey(p.name);
  const msgs = th.messages || [];
  const mine = m => normKey(m.senderName) === k;
  let lastMine = -1;
  for(let i = msgs.length-1; i >= 0; i--){ if(mine(msgs[i])){ lastMine = i; break; } }
  let n = 0;
  for(let i = lastMine+1; i < msgs.length; i++){ if(!mine(msgs[i])) n++; }
  return n;
}
function unreadOf(th, pid){
  const v = perOf(th, pid).unread;
  if(typeof v === 'number' && v >= 0) return v;
  return autoUnreadFor(th, pid);
}
function autoUnread(th){ return autoUnreadFor(th, effMeId()); }
function threadUnread(th){ return unreadOf(th, effMeId()); }

/* ---------- 목록 정렬 / 시간 표시 ---------- */
/* "오후 9:12" → 하루 중 분 단위 값 */
function timeToMinutes(s){
  const str = String(s||'');
  const m = str.match(/(\d{1,2}):(\d{2})/);
  if(!m) return 0;
  let h = +m[1];
  const mi = +m[2];
  if(/오후|PM|pm/.test(str) && h < 12) h += 12;
  if(/오전|AM|am/.test(str) && h === 12) h = 0;
  return h*60 + mi;
}
/* 대화의 마지막 메시지가 언제인지 (날짜는 바뀌는 날 첫 메시지에만 있으므로 누적해서 찾는다) */
function lastMsgWhen(th){
  const msgs = th.messages || [];
  if(!msgs.length) return null;
  let date = '';
  for(let i = 0; i < msgs.length; i++){ if(msgs[i].date) date = msgs[i].date; }
  const last = msgs[msgs.length-1];
  return { date: date, time: last.time || '', minutes: timeToMinutes(last.time) };
}
/* “오늘”로 볼 기준 날짜. 목록마다 지정할 수 있고, 비어 있으면 실제 오늘. */
function refToday(){
  const s = String((curList().today || '')).trim();
  if(s){
    const p = s.split('-');
    const y = +p[0], m = +p[1], d = +p[2];
    if(y && m && d){
      const dt = new Date(y, m-1, d);
      if(!isNaN(dt)) return { y:y, m:m, d:d, date:dt, fixed:true };
    }
  }
  const n = new Date();
  return { y:n.getFullYear(), m:n.getMonth()+1, d:n.getDate(),
           date:new Date(n.getFullYear(), n.getMonth(), n.getDate()), fixed:false };
}
/* 정렬용 숫자 (날짜가 없으면 기준 날짜로 본다) */
function threadSortValue(th){
  const w = lastMsgWhen(th);
  if(!w) return -1;
  let y, m, d;
  if(w.date){ const p = w.date.split('-'); y = +p[0]; m = +p[1]; d = +p[2]; }
  if(!(y && m && d)){ const t = refToday(); y = t.y; m = t.m; d = t.d; }
  return (y*10000 + m*100 + d) * 2000 + w.minutes;
}
/* 목록 오른쪽 표시: 오늘이면 시간, 어제면 “어제”, 그보다 전이면 “9월 8일” */
function listTimeLabel(th){
  const w = lastMsgWhen(th);
  if(!w) return '';
  if(!w.date) return w.time;
  const p = w.date.split('-');
  const y = +p[0], m = +p[1], d = +p[2];
  if(!(y && m && d)) return w.time;
  const ref = refToday();
  const target = new Date(y, m-1, d);
  const diff = Math.round((ref.date - target) / 86400000);
  if(diff === 0) return w.time;
  if(diff === 1) return '어제';
  if(y !== ref.y) return `${y}. ${m}. ${d}.`;   /* 기준 날짜와 해가 다르면 연도까지 */
  return `${m}월 ${d}일`;
}
/* 고정한 대화가 위, 그다음은 최신 메시지 순(자동 정렬을 끄면 저장된 순서) */
function orderedThreads(L){
  const auto = L.autoSort !== false;
  return visibleThreads(L).map((t,i)=>({t:t, i:i})).sort((a,b)=>{
    const pa = threadPinned(a.t)?1:0, pb = threadPinned(b.t)?1:0;
    if(pa !== pb) return pb - pa;
    if(auto){
      const sa = threadSortValue(a.t), sb = threadSortValue(b.t);
      if(sa !== sb) return sb - sa;
    }
    return a.i - b.i;
  }).map(x=>x.t);
}

/* ---------- 하단 여백 ----------
   폰 기종마다 다른 값이라 “이 기기에만” 따로 저장한다.
   기기 값이 없으면 파일에 담긴 기본값을 쓴다. 내용을 업데이트해도 기기 값은 유지된다. */
const PAD_KEY = 'crimescene_sms_pad';
function devicePad(){
  try{ const v = localStorage.getItem(PAD_KEY); return (v === null || v === '') ? null : Math.max(0, Number(v)||0); }
  catch(e){ return null; }
}
function setDevicePad(v){
  try{
    if(v === null) localStorage.removeItem(PAD_KEY);
    else localStorage.setItem(PAD_KEY, String(Math.max(0, Number(v)||0)));
  }catch(e){}
}
function filePad(){ const L = curList(); return Math.max(0, Number(L && L.bottomPad)||0); }

function renderMessages(th){
  const box = $('#messages'); box.innerHTML = '';
  const msgs = th.messages;

  /* 각 메시지가 속한 날짜를 먼저 계산 (날짜는 바뀌는 날 첫 메시지에만 입력) */
  const eff = [];
  let cd = null;
  msgs.forEach(m=>{ if(m.date && m.date !== cd) cd = m.date; eff.push(cd); });

  let shownDate = null;
  let lastSender = null;
  msgs.forEach((msg, i)=>{
    if(eff[i] && eff[i] !== shownDate){
      const dv = document.createElement('div');
      dv.className = 'date-divider';
      dv.innerHTML = `<span>${esc(formatKoreanDate(eff[i]))}</span>`;
      box.appendChild(dv);
      shownDate = eff[i];
      lastSender = null;
    }
    /* 보낸 사람이 “이 폰의 나”면 오른쪽(파란 말풍선) */
    const p = partOf(th, msg.senderName) || {name:msg.senderName, isMe:false, avatar:'', silo:0};
    const mine = !!p.isMe;
    const row = document.createElement('div');
    row.className = 'msg-row' + (mine?' mine':'');
    row.dataset.date = eff[i] || '';

    /* 상대 아바타·이름은 보낸 사람이 바뀐 첫 줄에만 표시 */
    const headOfRun = (lastSender !== normKey(msg.senderName));
    let avHtml = '';
    if(!mine){
      avHtml = headOfRun
        ? `<div class="m-av" style="${avatarStyle(p)}">${avatarInner(p)}</div>`
        : `<div class="m-av spacer"></div>`;
    }
    const senderHtml = (!mine && headOfRun && th.isGroup)
      ? `<div class="m-sender">${esc(dispName(p.name))}</div>` : '';

    let bubbleHtml;
    if(msg.image){
      bubbleHtml = `<div class="bubble img-bubble" data-photo="1">
          <img src="${msg.image}">
          ${msg.text?`<div class="cap">${esc(msg.text)}</div>`:''}
        </div>`;
    } else {
      bubbleHtml = `<div class="bubble">${esc(msg.text)}</div>`;
    }

    const statusHtml = (mine && msg.status) ? `<span class="m-status">${esc(msg.status)}</span>` : '';
    const infoHtml = `<div class="m-info">${statusHtml}<span class="m-time">${esc(msg.time||'')}</span></div>`;

    row.innerHTML = `
      ${avHtml}
      <div class="m-col">
        ${senderHtml}
        <div class="m-line">
          ${bubbleHtml}
          ${infoHtml}
        </div>
      </div>`;
    const ph = row.querySelector('[data-photo]');
    if(ph) ph.onclick = ()=> openPhoto(msg.image);
    box.appendChild(row);
    lastSender = normKey(msg.senderName);
  });
}

  const k = normKey(name);
  return (th.participants||[]).find(p=>normKey(p.name) === k) || null;

/* 설치가 안 될 때 원인을 한 화면에 모아 보여준다 */
function runDiag(){
  const out = [];
  const ua = navigator.userAgent || '';
  const cm = ua.match(/Chrome\/(\d+)/);
  const cv = cm ? Number(cm[1]) : 0;
  const inApp = /; wv\)|\bwv\b|KAKAOTALK|FBAN|FB_IAB|Instagram|NAVER|Line\//i.test(ua);
  out.push('코드 버전: ' + CODE_VERSION + ' / 파일 버전: ' + DATA_VERSION);
  out.push('브라우저: ' + (cm ? ('Chrome ' + cm[1]) : '크롬 아님 또는 확인 불가'));
  out.push('버전 판정: ' + (cv === 0 ? '확인 불가' : (cv >= 76 ? '앱 설치 지원 버전' : '너무 오래된 버전 — 크롬 업데이트 필요')));
  out.push('내장 브라우저: ' + (inApp ? '예 — 크롬 앱에서 직접 열어야 설치됩니다' : '아니오'));
  out.push('https(보안) 상태: ' + (window.isSecureContext ? '정상' : '아님 — 설치 불가'));
  out.push('서비스워커 지원: ' + (('serviceWorker' in navigator) ? '지원' : '지원 안 함'));
  out.push('서비스워커 상태: ' + swState);
  out.push('설치 신호(beforeinstallprompt): ' + (deferredInstall ? '받음' : '아직 없음'));
  const box = document.getElementById('diagOut');
  box.style.display = 'block';
  box.textContent = out.join('\n') + '\n서버 응답 확인 중…';
  const jobs = [];
  jobs.push(fetch('./sw.js?diag=' + Date.now(), {cache:'no-store'})
    .then(r=> 'sw.js 응답: ' + r.status + ' / ' + (r.headers.get('content-type')||'?'))
    .catch(e=> 'sw.js 응답: 실패 (' + e + ')'));
  jobs.push((('serviceWorker' in navigator) ? navigator.serviceWorker.getRegistrations() : Promise.resolve([]))

/* ----- 끌어서 순서 바꾸기 (마우스·터치 공용) ----- */
function makeSortable(box, onDone){
  if(!box) return;
  box.classList.add('sortable');
  let el = null, armed = false, dragging = false, startY = 0, timer = null;
  const items = ()=> [].slice.call(box.querySelectorAll('[data-sort]'));
  const stop = ()=>{
    clearTimeout(timer);
    if(el) el.classList.remove('dragging');
    const did = dragging;
    el = null; armed = false; dragging = false;
    if(did) onDone(items().map(x=>x.dataset.sort));
  };
  box.addEventListener('pointerdown', e=>{
    const t = e.target.closest('[data-sort]');
    if(!t || e.target.closest('button, input, textarea, select, .node-name')) return;
    el = t; startY = e.clientY; armed = false; dragging = false;
    if(e.pointerType === 'mouse'){ armed = true; }
    else { timer = setTimeout(()=>{ armed = true; el.classList.add('dragging'); }, 280); }
  });
  box.addEventListener('pointermove', e=>{
    if(!el) return;
    if(!armed){
      if(Math.abs(e.clientY - startY) > 8){ clearTimeout(timer); el = null; }
      return;
    }
    if(!dragging){
      if(Math.abs(e.clientY - startY) < 4) return;
      dragging = true;
      el.classList.add('dragging');
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
    }
    const y = e.clientY;
    items().forEach(s=>{
      if(s === el) return;
      const r = s.getBoundingClientRect();
      if(y > r.top && y < r.bottom){
        const mid = r.top + r.height/2;
        if(y < mid) box.insertBefore(el, s);
        else box.insertBefore(el, s.nextSibling);
      }
    });
  });
  box.addEventListener('pointerup', stop);
  box.addEventListener('pointercancel', stop);
  box.addEventListener('touchmove', e=>{ if(dragging) e.preventDefault(); }, {passive:false});
}

/* ----- 분류 화면의 버튼 연결 ----- */
function uniqueName(existing, base){
  let n = base, i = 2;
  while(existing.indexOf(n) !== -1){ n = base + ' ' + i; i++; }
  return n;
}
function keysUnderC1(c1){
  const out = [];
  (c1.children||[]).forEach(c2=>(c2.lists||[]).forEach(k=>out.push(k)));
  return out;
}
function deleteListByKey(key){
  const L = listByKey(key);
  if(!L) return;
  const cur = data.lists[listIdx];
  const i = data.lists.indexOf(L);
  data.lists.splice(i, 1);
  treeRemoveList(key);
  const ni = data.lists.indexOf(cur);
  listIdx = (ni >= 0) ? ni : Math.max(0, Math.min(i, data.lists.length - 1));
}
function reorderListsByTree(){
  const cur = data.lists[listIdx];
  const seen = {}, out = [];
  data.tree.forEach(c1=>(c1.children||[]).forEach(c2=>(c2.lists||[]).forEach(k=>{
    const L = listByKey(k);
    if(L && !seen[normKey(L.key)]){ seen[normKey(L.key)] = 1; out.push(L); }
  })));
  data.lists.forEach(L=>{ if(!seen[normKey(L.key)]) out.push(L); });
  data.lists = out;
  const i = data.lists.indexOf(cur);
  listIdx = (i >= 0) ? i : 0;
}

    el.ondblclick = openEdit;

  const nSave = $('#nodeSave');

    /* 편집칸이 열리면 바로 입력할 수 있게 커서를 두고, 화면 가운데로 보여 준다 */

    };
    nSave.onclick = ()=>{
      const nameVal = $('#nodeName').value.trim();

        const node = data.tree.find(c=>c.id === editingNode.slice(3));
        if(node) node.name = nameVal;
      } else if(editingNode.indexOf('P:') === 0){
        const L = curList();
        const p = personById(L, editingNode.slice(2));
        if(!p){ toast('인물을 찾지 못했습니다'); editingNode = ''; renderAdminHome(); return; }
        if(normKey(p.name) === normKey(nameVal)){ editingNode = ''; renderAdminHome(); return; }   /* 그대로면 조용히 닫는다 */
        const dup = personByName(L, nameVal);
        if(dup && dup !== p){
          /* 이미 있는 이름 — 합쳐지면 되돌릴 수 없으므로 먼저 물어본다 */
          confirmDialog('이미 “' + dup.name + '” 인물이 있습니다.\n두 인물을 한 사람으로 합칠까요?\n(대화·메시지도 모두 “' + dup.name + '” 한 사람으로 모입니다)', ()=>{
            renamePerson(L, p, nameVal);
            editingNode = ''; save(); syncUrl(); renderAdminHome(); toast('한 사람으로 합쳤습니다');
          }, '합치기');
          return;
        }
        if(!renamePerson(L, p, nameVal)){ toast('이름을 바꾸지 못했습니다'); return; }
      } else if(editingNode.indexOf('c2:') === 0){
        const c1 = curC1();
        const node = c1 && (c1.children||[]).find(c=>c.id === editingNode.slice(3));
        if(node){
          node.name = nameVal;
          /* 테마 = 문자 앱 한 벌. 이름과 주소를 같이 맞춰 준다 */
          const L = listsOfCat(node)[0];
          const keyEl = $('#nodeKey');
          if(L){
            L.label = nameVal;
            const oldKey = L.key;
            const newKey = sanitizeKey(keyEl ? keyEl.value : '');
            if(newKey && normKey(newKey) !== normKey(oldKey)){
              if(data.lists.some(x=>x !== L && normKey(x.key) === normKey(newKey))){
                toast('같은 주소용 이름이 이미 있습니다'); return;
              }
              L.key = newKey;
              treeRenameListKey(oldKey, newKey);
              if(viewAs[oldKey]){ viewAs[newKey] = viewAs[oldKey]; delete viewAs[oldKey]; saveView(); }
              try{
                if(savedListKey() && normKey(savedListKey()) === normKey(oldKey)) localStorage.setItem(LAST_KEY, newKey);
              }catch(e){}
            }
          }
        }
      }
      editingNode = ''; save(); syncUrl(); renderAdminHome(); toast('저장되었습니다');
    };
  }

  const add = $('#treeAdd');
  if(add) add.onclick = ()=>{
    const c1 = curC1(), c2 = curC2();
    if(!c1){
      data.tree.push({ id:id(), name:uniqueName(data.tree.map(x=>x.name), '새 지점'), children:[] });
    } else if(!c2){
      const node = { id:id(), name:uniqueName(c1.children.map(x=>x.name), '새 테마'), lists:[] };
      c1.children.push(node);
      listOfCat(c1, node);            /* 테마마다 문자 앱 한 벌을 만들어 둔다 */
    } else {
      const L = listOfCat(c1, c2);
      const list = peopleOf(L);                 /* 먼저 명단을 확정한 뒤에 넣는다 */
      const nm = uniqueName(list.map(p=>p.name), '새 인물');
      const np = { id:newPersonId(L, nm), name:nm, sub:'', avatar:'', silo:list.length % 2 };
      list.push(np);
      editingNode = 'P:' + np.id;      /* 만들자마자 이름을 바로 고칠 수 있게 연다 */
    }
    save(); renderAdminHome();
  };

  body.querySelectorAll('[data-cdel]').forEach(b=> b.onclick = ()=>{
    const v = b.dataset.cdel;
    const isC1 = (v.indexOf('c1:') === 0);
    let node, keys, removeIt;
    if(isC1){
      const i = data.tree.findIndex(c=>c.id === v.slice(3));
      if(i < 0) return;
      node = data.tree[i]; keys = keysUnderC1(node);
      removeIt = ()=> data.tree.splice(i, 1);
    } else {
      const c1 = curC1(); if(!c1) return;
      const i = (c1.children||[]).findIndex(c=>c.id === v.slice(3));
      if(i < 0) return;
      node = c1.children[i]; keys = (node.lists||[]).slice();
      removeIt = ()=> c1.children.splice(i, 1);
    }
    if(keys.length && keys.length >= data.lists.length){
      toast('테마는 최소 1개 필요합니다. 다른 지점에 테마를 남겨두세요.');
      return;
    }
    const openKey = curList() ? curList().key : '';
    const doIt = ()=>{
      if(keys.some(k=>normKey(k) === normKey(openKey))){ adminListPicked = false; adminThreadId = ''; }
      keys.forEach(k=>deleteListByKey(k));
      removeIt();
      save(); renderAdminHome(); toast('삭제되었습니다');
    };
    const threads = keys.reduce((a,k)=>{ const L = listByKey(k); return a + (L ? L.threads.length : 0); }, 0);
    if(threads) confirmDialog('“' + node.name + '” 안에 대화 ' + threads + '개가 있습니다.\n안의 내용까지 함께 삭제할까요?', doIt, '모두 삭제');
    else confirmDialog('“' + node.name + '” 을(를) 삭제할까요?', doIt);
  });

  makeSortable($('#treeBox'), order=>{
    const c1 = curC1(), c2 = curC2();
    if(!c1){
      data.tree = order.map(v=>data.tree.find(c=>c.id === v)).filter(Boolean);
    } else if(!c2){
      c1.children = order.map(v=>(c1.children||[]).find(c=>c.id === v)).filter(Boolean);
      reorderListsByTree();
    } else {
      /* 테마 안에서는 등장인물 순서를 바꾼다 */
      const L = listOfCat(c1, c2);
      const map = {};
      peopleOf(L).forEach(p=>{ map[p.id] = p; });
      const out = order.map(v=>map[v]).filter(Boolean);
      L.people.forEach(p=>{ if(out.indexOf(p) < 0) out.push(p); });
      L.people = out;
    }
    save(); renderAdminHome(); toast('순서가 바뀌었습니다');
  });
  bindPeopleSection(body);
}

/* ----- 다른 대화 목록의 대화 불러오기 (분류를 따라 폴더처럼 이동) ----- */
let impPath = [];   /* [] | [대분류id] | [대분류id, 중분류id] | [대분류id, 중분류id, 목록key] */
function importThreadPanel(){
  const c1 = impPath[0] ? data.tree.find(c=>c.id === impPath[0]) : null;
  const c2 = (c1 && impPath[1]) ? (c1.children||[]).find(c=>c.id === impPath[1]) : null;
  const L  = (c2 && impPath[2]) ? listByKey(impPath[2]) : null;
  let rows = '';

  if(!c1){
    if(!data.tree.length) rows = '<div class="hint" style="margin:0">분류가 없습니다.</div>';
    data.tree.forEach(node=>{
      const cnt = countInCat1(node);
      rows += `
        <div class="admin-list-item">
          <div class="top">
            <div style="min-width:0"><div class="rname">${esc(node.name)}</div>
              <div class="rsub">중분류 ${cnt.subs}개 · 목록 ${cnt.lists}개</div></div>
            <button class="btn btn-ghost btn-sm" data-impgo="${node.id}">열기</button>
          </div>
        </div>`;
    });
  } else if(!c2){
    if(!(c1.children||[]).length) rows = '<div class="hint" style="margin:0">중분류가 없습니다.</div>';
    (c1.children||[]).forEach(node=>{
      rows += `
        <div class="admin-list-item">
          <div class="top">
            <div style="min-width:0"><div class="rname">${esc(node.name)}</div>
              <div class="rsub">목록 ${(node.lists||[]).length}개</div></div>
            <button class="btn btn-ghost btn-sm" data-impgo="${node.id}">열기</button>
          </div>
        </div>`;
    });
  } else if(!L){
    const items = listsOfCat(c2).filter(x=>x !== curList());
    if(!items.length) rows = '<div class="hint" style="margin:0">불러올 목록이 없습니다.</div>';
    items.forEach(x=>{
      rows += `
        <div class="admin-list-item">
          <div class="top">
            <div style="min-width:0"><div class="rname">${esc(listLabel(x))}</div>
              <div class="rsub">대화 ${x.threads.length}개</div></div>
            <button class="btn btn-ghost btn-sm" data-impgo="${esc(x.key)}">열기</button>
          </div>
        </div>`;
    });
  } else {
    if(!L.threads.length) rows = '<div class="hint" style="margin:0">이 목록에는 대화가 없습니다.</div>';
    L.threads.forEach((t, ti)=>{
      const last = t.messages[t.messages.length-1];
      rows += `
        <div class="admin-list-item">
          <div class="top">
            <div style="min-width:0">
              <div class="rname">${esc(threadLabel(t))}</div>
              <div class="rsub">참여자 ${(t.participants||[]).length}명 · 메시지 ${t.messages.length}개</div>
              <div class="rsub">${esc(previewText(last) || '(내용 없음)')}</div>
            </div>
            <button class="btn btn-primary btn-sm" data-imp="${esc(L.key)}:${ti}">불러오기</button>
          </div>
        </div>`;
    });
  }

  const crumb = [c1 && c1.name, c2 && c2.name, L && listLabel(L)].filter(Boolean).join(' › ') || '전체 분류';
  return `
    <div style="background:#f7f9fb;border:1px solid #e3e7ec;border-radius:10px;padding:10px;margin-bottom:10px">
      <div class="hint" style="margin:0 0 8px">다른 대화 목록의 대화를 <b>상대 정보·메시지 그대로</b> 이 목록(<b>${esc(listLabel(curList()))}</b>)으로 복사합니다. 원본은 그대로 남습니다.</div>
      <div class="crumb">
        ${impPath.length ? '<button class="btn btn-ghost btn-sm" id="impUp">↑ 상위 폴더</button>' : ''}
        <span class="crumb-txt">${esc(crumb)}</span>
      </div>
      ${rows}
      <button class="btn btn-ghost btn-sm btn-block" id="importThreadClose">닫기</button>
    </div>`;
}
