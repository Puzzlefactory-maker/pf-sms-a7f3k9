/* ----- 분류(폴더) 탐색 화면 ----- */
let treePath = [];          /* [] | [지점id] | [지점id, 테마id] */
let adminListPicked = false;/* 특정 테마(문자 앱 한 벌)를 “열기”로 고른 상태인지 */
let editingNode = '';       /* 이름 편집 중인 항목 (c1:id / c2:id / P:인물id) */
let foldState = { pad:true , size:true };   /* 접힘 상태 (기본 접힘) */

function curC1(){ return treePath[0] ? data.tree.find(c=>c.id===treePath[0]) : null; }
function curC2(){ const c1 = curC1(); return (c1 && treePath[1]) ? (c1.children||[]).find(c=>c.id===treePath[1]) : null; }
function listLabel(L){ return (L.label && L.label.trim()) ? L.label : L.key; }
function listPathText(L){
  const c = catOfList(L.key);
  return c ? (c.c1.name + ' › ' + c.c2.name) : '미분류';
}
function breadcrumbHtml(){
  const c1 = curC1(), c2 = curC2();
  if(!c1) return '<span class="crumb-txt">전체 분류</span>';
  return '<span class="crumb-txt">' + esc(c1.name) + (c2 ? '<span class="sep">›</span>' + esc(c2.name) : '') + '</span>';
}
function nameEditorHtml(nodeId, name, keyValue){
  /* 목록이면 표시 이름 + 주소용 이름 두 칸, 폴더면 이름 한 칸 */
  if(keyValue === null){
    return `
      <div class="field" style="margin:8px 0 0">
        <label>이름</label>
        <input id="nodeName" value="${esc(name)}">
      </div>
      <div class="row-actions">
        <button class="btn btn-primary btn-sm" id="nodeSave">저장</button>
        <button class="btn btn-ghost btn-sm" id="nodeCancel">취소</button>
      </div>`;
  }
  return `
    <div class="field" style="margin:8px 0 0">
      <label>이름 (관리자 화면 표시용)</label>
      <input id="nodeName" value="${esc(name)}">
    </div>
    <div class="field">
      <label>주소용 이름 (?list= 뒤에 붙는 이름)</label>
      <input id="nodeKey" value="${esc(keyValue)}">
      <div class="hint" style="margin-top:4px">주소를 바꾸면 예전 주소(<b>?list=…</b>)로 저장해 둔 링크는 열리지 않습니다.
        바뀐 주소를 다시 알려주세요.</div>
    </div>
    <div class="row-actions">
      <button class="btn btn-primary btn-sm" id="nodeSave">저장</button>
      <button class="btn btn-ghost btn-sm" id="nodeAuto">경로에서 자동 생성</button>
      <button class="btn btn-ghost btn-sm" id="nodeCancel">취소</button>
    </div>`;
}
function treeItemsHtml(){
  const c1 = curC1(), c2 = curC2();
  let html = '';
  if(!c1){
    if(!data.tree.length) return '<div class="hint">분류가 없습니다. 아래에서 새 지점을 만드세요.</div>';
    data.tree.forEach(node=>{
      const cnt = countInCat1(node);
      const editing = (editingNode === 'c1:' + node.id);
      html += `
        <div class="admin-list-item" data-sort="${node.id}">
          <div class="top">
            <div style="min-width:0">
              <div class="node-name" data-rename="c1:${node.id}">${esc(node.name)}<span class="pen">✎</span></div>
              <div class="rsub">테마 ${cnt.subs}개 · 대화 ${cnt.threads}개</div>
            </div>
            <div class="row-actions">
              <button class="btn btn-ghost btn-sm" data-enter="${node.id}">열기</button>
              <button class="btn btn-danger btn-sm" data-cdel="c1:${node.id}">삭제</button>
            </div>
          </div>
          ${editing ? nameEditorHtml('c1:'+node.id, node.name, null) : ''}
        </div>`;
    });
    return html;
  }
  if(!c2){
    if(!c1.children.length) return '<div class="hint">테마가 없습니다. 아래에서 새 테마를 만드세요.</div>';
    c1.children.forEach(node=>{
      const editing = (editingNode === 'c2:' + node.id);
      const L = listsOfCat(node)[0];
      const opened = L && data.lists.indexOf(L) === listIdx && adminListPicked;
      html += `
        <div class="admin-list-item ${opened?'on':''}" data-sort="${node.id}">
          <div class="top">
            <div style="min-width:0">
              <div class="node-name" data-rename="c2:${node.id}">${esc(node.name)}<span class="pen">✎</span>
                ${opened?'<span class="me-tag">보는 중</span>':''}</div>
              <div class="rsub">등장인물 ${L?peopleOf(L).length:0}명 · 대화 ${L?L.threads.length:0}개</div>
              ${L?`<div class="rsub">?list=${esc(L.key)}</div>`:''}
            </div>
            <div class="row-actions">
              <button class="btn btn-ghost btn-sm" data-enter="${node.id}">열기</button>
              <button class="btn btn-danger btn-sm" data-cdel="c2:${node.id}">삭제</button>
            </div>
          </div>
          ${editing ? nameEditorHtml('c2:'+node.id, node.name, L?L.key:null) : ''}
        </div>`;
    });
    return html;
  }
  /* 테마 안 = 등장인물 명단 (대화 내용은 이 테마에 한 벌만 있다) */
  const L = listOfCat(c1, c2);
  const ps = peopleOf(L);
  if(!ps.length) return '<div class="hint">등장인물이 없습니다. 아래에서 새 인물을 만드세요.<br>인물을 만든 뒤 대화를 추가하면 됩니다.</div>';
  const myId = meId();
  const meP = myId ? personById(L, myId) : null;
  ps.forEach(p=>{
    const editing = (editingNode === 'P:' + p.id);
    const n = threadsOfPerson(L, p.id).length;
    const alias = (myId && p.id !== myId) ? (aliasMap(L, myId)[p.id] || '') : null;
    html += `
      <div class="admin-list-item ${p.id===myId?'on':''}" data-sort="${p.id}">
        <div class="ppl-row">
          <div class="part-thumb" data-pphoto="${p.id}" title="사진 변경" style="${avatarStyle(p)}">${p.avatar?`<img src="${p.avatar}">`:(isNumberish(p.name)?silhouetteSVG():esc((p.name||'?').trim().charAt(0)))}</div>
          <div class="ppl-body">
            <div class="ppl-head">
              <span class="node-name" data-rename="P:${p.id}">${esc(p.name)}<span class="pen">✎</span></span>
              <span class="rsub">참여 대화 ${n}개</span>
            </div>
            ${p.id===myId ? '<div class="rsub"><span class="me-tag">이 기기의 나</span></div>' : ''}
            <div class="field" style="margin:7px 0 0">
              <label>번호·부제 (상대 이름 아래 회색 글씨)</label>
              <input data-psub="${p.id}" value="${esc(p.sub||'')}" placeholder="예) 010-1234-5678">
            </div>
            <div class="ppl-btns">
              ${p.id===myId ? '' : `<button class="btn btn-ghost btn-sm" data-pme="${p.id}">이 사람으로 보기</button>`}
              <button class="btn btn-danger btn-sm" data-pdel="${p.id}">삭제</button>
            </div>
            ${alias === null ? '' : `<div class="ppl-alias">
              <label>${esc(meP.name)} 폰에서 부를 이름</label>
              <input data-alias="${p.id}" value="${esc(alias)}" placeholder="${esc(p.name)}">
            </div>`}
          </div>
        </div>
        ${editing ? nameEditorHtml('P:'+p.id, p.name, null) : ''}
      </div>`;
  });
  return html;
}

/* ----- 등장인물 줄의 버튼 연결 (분류 칸의 테마 안에서 쓰인다) ----- */
function bindPeopleSection(body){
  const L = curList();
  body.querySelectorAll('[data-pphoto]').forEach(el=> el.onclick = ()=>{
    const p = personById(L, el.dataset.pphoto);
    if(!p) return;
    pickImage(FACE_PX, url=>{ p.avatar = url; spreadPerson(L, p); save(); renderAdminHome(); toast('사진이 설정되었습니다 (이 인물이 있는 모든 대화에 적용)'); }, true);
  });
  body.querySelectorAll('[data-psub]').forEach(inp=> inp.onchange = ()=>{
    const p = personById(L, inp.dataset.psub);
    if(!p) return;
    p.sub = inp.value.trim(); spreadPerson(L, p); save(); toast('번호를 저장했습니다');
  });
  body.querySelectorAll('[data-pme]').forEach(b=> b.onclick = ()=>{
    setMe(b.dataset.pme); save(); renderAdminHome();
    toast('이 기기에서 볼 사람을 바꿨습니다');
  });
  body.querySelectorAll('[data-alias]').forEach(inp=> inp.onchange = ()=>{
    const vid = meId();
    if(!vid) return;
    setAlias(L, vid, inp.dataset.alias, inp.value);
    save(); renderAdminHome();
    toast(inp.value.trim() ? '이 폰에서 부를 이름을 정했습니다' : '원래 이름으로 되돌렸습니다');
  });
  body.querySelectorAll('[data-pdel]').forEach(b=> b.onclick = ()=>{
    const p = personById(L, b.dataset.pdel);
    if(!p) return;
    const n = threadsOfPerson(L, p.id).length;
    confirmDialog('인물 “' + p.name + '” 을(를) 명단에서 지울까요?'
      + (n ? '\n참여 중인 대화 ' + n + '개에서도 빠집니다. (대화와 메시지는 그대로 남습니다)' : ''), ()=>{
      const k = normKey(p.name);
      const wasMe = (meId() === p.id);
      (L.threads||[]).forEach(t=>{
        t.participants = (t.participants||[]).filter(x=>normKey(x.name) !== k);
        if(t.per) delete t.per[p.id];
        if(Array.isArray(t.only)) t.only = t.only.filter(x=>x !== p.id);
      });
      L.people = L.people.filter(x=>x.id !== p.id);
      if(L.alias){
        delete L.alias[p.id];
        Object.keys(L.alias).forEach(v=>{ delete L.alias[v][p.id]; if(!Object.keys(L.alias[v]).length) delete L.alias[v]; });
      }
      if(wasMe){ delete viewAs[L.key]; saveView(); }
      applyMeFlags();
      save(); renderAdminHome(); toast('지웠습니다');
    });
  });
}

/* ----- 끌어서 순서 바꾸기 (마우스·터치 공용) ----- */
function makeSortable(box, onDone){
  if(!box) return;
  box.classList.add('sortable');
  let el = null, armed = false, dragging = false, startY = 0, timer = null;
  const items = ()=> [].slice.call(box.querySelectorAll('[data-sort]'));
  const stop = ()=>{
    clearTimeout(timer);
    if(el) el.classList.remove('dragging');
    const did = dragging;
    el = null; armed = false; dragging = false;
    if(did) onDone(items().map(x=>x.dataset.sort));
  };
  box.addEventListener('pointerdown', e=>{
    const t = e.target.closest('[data-sort]');
    if(!t || e.target.closest('button, input, textarea, select, .node-name')) return;
    el = t; startY = e.clientY; armed = false; dragging = false;
    if(e.pointerType === 'mouse'){ armed = true; }
    else { timer = setTimeout(()=>{ armed = true; el.classList.add('dragging'); }, 280); }
  });
  box.addEventListener('pointermove', e=>{
    if(!el) return;
    if(!armed){
      if(Math.abs(e.clientY - startY) > 8){ clearTimeout(timer); el = null; }
      return;
    }
    if(!dragging){
      if(Math.abs(e.clientY - startY) < 4) return;
      dragging = true;
      el.classList.add('dragging');
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
    }
    const y = e.clientY;
    items().forEach(s=>{
      if(s === el) return;
      const r = s.getBoundingClientRect();
      if(y > r.top && y < r.bottom){
        const mid = r.top + r.height/2;
        if(y < mid) box.insertBefore(el, s);
        else box.insertBefore(el, s.nextSibling);
      }
    });
  });
  box.addEventListener('pointerup', stop);
  box.addEventListener('pointercancel', stop);
  box.addEventListener('touchmove', e=>{ if(dragging) e.preventDefault(); }, {passive:false});
}

/* ----- 분류 화면의 버튼 연결 ----- */
function uniqueName(existing, base){
  let n = base, i = 2;
  while(existing.indexOf(n) !== -1){ n = base + ' ' + i; i++; }
  return n;
}
function keysUnderC1(c1){
  const out = [];
  (c1.children||[]).forEach(c2=>(c2.lists||[]).forEach(k=>out.push(k)));
  return out;
}
function deleteListByKey(key){
  const L = listByKey(key);
  if(!L) return;
  const cur = data.lists[listIdx];
  const i = data.lists.indexOf(L);
  data.lists.splice(i, 1);
  treeRemoveList(key);
  const ni = data.lists.indexOf(cur);
  listIdx = (ni >= 0) ? ni : Math.max(0, Math.min(i, data.lists.length - 1));
}
function reorderListsByTree(){
  const cur = data.lists[listIdx];
  const seen = {}, out = [];
  data.tree.forEach(c1=>(c1.children||[]).forEach(c2=>(c2.lists||[]).forEach(k=>{
    const L = listByKey(k);
    if(L && !seen[normKey(L.key)]){ seen[normKey(L.key)] = 1; out.push(L); }
  })));
  data.lists.forEach(L=>{ if(!seen[normKey(L.key)]) out.push(L); });
  data.lists = out;
  const i = data.lists.indexOf(cur);
  listIdx = (i >= 0) ? i : 0;
}

function bindTreeSection(body){
  body.querySelectorAll('[data-fold]').forEach(h=>{
    h.onclick = ()=>{ const k = h.dataset.fold; foldState[k] = !foldState[k]; renderAdminHome(); };
  });
  const up = $('#treeUp');
  if(up) up.onclick = ()=>{
    if(treePath.length <= treeMinDepth()) return;   /* 잠긴 지점 위로는 못 올라간다 */
    treePath.pop(); editingNode = '';
    adminListPicked = false; adminThreadId = '';   /* 상위 폴더로 가면 테마 선택을 푼다 */
    renderAdminHome();
  };
  body.querySelectorAll('[data-enter]').forEach(b=> b.onclick = ()=>{
    const wasC1 = !!curC1();
    treePath.push(b.dataset.enter); editingNode = '';
    adminThreadId = '';
    const c1 = curC1(), c2 = curC2();
    if(wasC1 && c1 && c2){
      /* 테마 하나 = 문자 앱 한 벌. 열면 바로 그 내용을 편집한다 */
      const L = listOfCat(c1, c2);
      const i = data.lists.indexOf(L);
      if(i >= 0) listIdx = i;
      adminListPicked = true;
      applyMeFlags();
    } else {
      adminListPicked = false;
    }
    save(); renderAdminHome();
  });
  body.querySelectorAll('[data-rename]').forEach(el=>{
    const openEdit = ()=>{ editingNode = el.dataset.rename; renderAdminHome(); };
    el.onclick = openEdit;          /* 한 번만 눌러도 열린다 (폰에서 두 번 누르기가 잘 안 먹는 문제) */
    el.ondblclick = openEdit;
  });

  const nSave = $('#nodeSave');
  if(nSave){
    $('#nodeCancel').onclick = ()=>{ editingNode = ''; renderAdminHome(); };
    /* 편집칸이 열리면 바로 입력할 수 있게 커서를 두고, 화면 가운데로 보여 준다 */
    const nName = $('#nodeName');
    if(nName){
      nName.onkeydown = e=>{ if(e.key === 'Enter'){ e.preventDefault(); nSave.click(); } };
      setTimeout(()=>{
        try{
          const item = nName.closest('.admin-list-item');
          if(item) item.scrollIntoView({block:'center'});
          nName.focus(); nName.select();
        }catch(e){}
      }, 30);
    }
    const auto = $('#nodeAuto');
    if(auto) auto.onclick = ()=>{
      const c1 = curC1(), c2 = curC2();
      const label = $('#nodeName').value.trim() || '목록';
      $('#nodeKey').value = makeListKey(c1?c1.name:'', c2?c2.name:'', label, listByKey(editingNode.slice(2)));
    };
    nSave.onclick = ()=>{
      const nameVal = $('#nodeName').value.trim();
      if(!nameVal){ toast('이름을 입력하세요'); return; }
      if(editingNode.indexOf('c1:') === 0){
        const node = data.tree.find(c=>c.id === editingNode.slice(3));
        if(node) node.name = nameVal;
      } else if(editingNode.indexOf('P:') === 0){
        const L = curList();
        const p = personById(L, editingNode.slice(2));
        if(!p){ toast('인물을 찾지 못했습니다'); editingNode = ''; renderAdminHome(); return; }
        if(normKey(p.name) === normKey(nameVal)){ editingNode = ''; renderAdminHome(); return; }   /* 그대로면 조용히 닫는다 */
        const dup = personByName(L, nameVal);
        if(dup && dup !== p){
          /* 이미 있는 이름 — 합쳐지면 되돌릴 수 없으므로 먼저 물어본다 */
          confirmDialog('이미 “' + dup.name + '” 인물이 있습니다.\n두 인물을 한 사람으로 합칠까요?\n(대화·메시지도 모두 “' + dup.name + '” 한 사람으로 모입니다)', ()=>{
            renamePerson(L, p, nameVal);
            editingNode = ''; save(); syncUrl(); renderAdminHome(); toast('한 사람으로 합쳤습니다');
          }, '합치기');
          return;
        }
        if(!renamePerson(L, p, nameVal)){ toast('이름을 바꾸지 못했습니다'); return; }
      } else if(editingNode.indexOf('c2:') === 0){
        const c1 = curC1();
        const node = c1 && (c1.children||[]).find(c=>c.id === editingNode.slice(3));
        if(node){
          node.name = nameVal;
          /* 테마 = 문자 앱 한 벌. 이름과 주소를 같이 맞춰 준다 */
          const L = listsOfCat(node)[0];
          const keyEl = $('#nodeKey');
          if(L){
            L.label = nameVal;
            const oldKey = L.key;
            const newKey = sanitizeKey(keyEl ? keyEl.value : '');
            if(newKey && normKey(newKey) !== normKey(oldKey)){
              if(data.lists.some(x=>x !== L && normKey(x.key) === normKey(newKey))){
                toast('같은 주소용 이름이 이미 있습니다'); return;
              }
              L.key = newKey;
              treeRenameListKey(oldKey, newKey);
              if(viewAs[oldKey]){ viewAs[newKey] = viewAs[oldKey]; delete viewAs[oldKey]; saveView(); }
              try{
                if(savedListKey() && normKey(savedListKey()) === normKey(oldKey)) localStorage.setItem(LAST_KEY, newKey);
              }catch(e){}
            }
          }
        }
      }
      editingNode = ''; save(); syncUrl(); renderAdminHome(); toast('저장되었습니다');
    };
  }

  const add = $('#treeAdd');
  if(add) add.onclick = ()=>{
    const c1 = curC1(), c2 = curC2();
    if(!c1){
      data.tree.push({ id:id(), name:uniqueName(data.tree.map(x=>x.name), '새 지점'), children:[] });
    } else if(!c2){
      const node = { id:id(), name:uniqueName(c1.children.map(x=>x.name), '새 테마'), lists:[] };
      c1.children.push(node);
      listOfCat(c1, node);            /* 테마마다 문자 앱 한 벌을 만들어 둔다 */
    } else {
      const L = listOfCat(c1, c2);
      const list = peopleOf(L);                 /* 먼저 명단을 확정한 뒤에 넣는다 */
      const nm = uniqueName(list.map(p=>p.name), '새 인물');
      const np = { id:newPersonId(L, nm), name:nm, sub:'', avatar:'', silo:list.length % 2 };
      list.push(np);
      editingNode = 'P:' + np.id;      /* 만들자마자 이름을 바로 고칠 수 있게 연다 */
    }
    save(); renderAdminHome();
  };

  body.querySelectorAll('[data-cdel]').forEach(b=> b.onclick = ()=>{
    const v = b.dataset.cdel;
    const isC1 = (v.indexOf('c1:') === 0);
    let node, keys, removeIt;
    if(isC1){
      const i = data.tree.findIndex(c=>c.id === v.slice(3));
      if(i < 0) return;
      node = data.tree[i]; keys = keysUnderC1(node);
      removeIt = ()=> data.tree.splice(i, 1);
    } else {
      const c1 = curC1(); if(!c1) return;
      const i = (c1.children||[]).findIndex(c=>c.id === v.slice(3));
      if(i < 0) return;
      node = c1.children[i]; keys = (node.lists||[]).slice();
      removeIt = ()=> c1.children.splice(i, 1);
    }
    if(keys.length && keys.length >= data.lists.length){
      toast('테마는 최소 1개 필요합니다. 다른 지점에 테마를 남겨두세요.');
      return;
    }
    const openKey = curList() ? curList().key : '';
    const doIt = ()=>{
      if(keys.some(k=>normKey(k) === normKey(openKey))){ adminListPicked = false; adminThreadId = ''; }
      keys.forEach(k=>deleteListByKey(k));
      removeIt();
      save(); renderAdminHome(); toast('삭제되었습니다');
    };
    const threads = keys.reduce((a,k)=>{ const L = listByKey(k); return a + (L ? L.threads.length : 0); }, 0);
    if(threads) confirmDialog('“' + node.name + '” 안에 대화 ' + threads + '개가 있습니다.\n안의 내용까지 함께 삭제할까요?', doIt, '모두 삭제');
    else confirmDialog('“' + node.name + '” 을(를) 삭제할까요?', doIt);
  });

  makeSortable($('#treeBox'), order=>{
    const c1 = curC1(), c2 = curC2();
    if(!c1){
      data.tree = order.map(v=>data.tree.find(c=>c.id === v)).filter(Boolean);
    } else if(!c2){
      c1.children = order.map(v=>(c1.children||[]).find(c=>c.id === v)).filter(Boolean);
      reorderListsByTree();
    } else {
      /* 테마 안에서는 등장인물 순서를 바꾼다 */
      const L = listOfCat(c1, c2);
      const map = {};
      peopleOf(L).forEach(p=>{ map[p.id] = p; });
      const out = order.map(v=>map[v]).filter(Boolean);
      L.people.forEach(p=>{ if(out.indexOf(p) < 0) out.push(p); });
      L.people = out;
    }
    save(); renderAdminHome(); toast('순서가 바뀌었습니다');
  });
  bindPeopleSection(body);
}

/* ----- 다른 대화 목록의 대화 불러오기 (분류를 따라 폴더처럼 이동) ----- */
let impPath = [];   /* [] | [대분류id] | [대분류id, 중분류id] | [대분류id, 중분류id, 목록key] */
function importThreadPanel(){
  const c1 = impPath[0] ? data.tree.find(c=>c.id === impPath[0]) : null;
  const c2 = (c1 && impPath[1]) ? (c1.children||[]).find(c=>c.id === impPath[1]) : null;
  const L  = (c2 && impPath[2]) ? listByKey(impPath[2]) : null;
  let rows = '';

  if(!c1){
    if(!data.tree.length) rows = '<div class="hint" style="margin:0">분류가 없습니다.</div>';
    data.tree.forEach(node=>{
      const cnt = countInCat1(node);
      rows += `
        <div class="admin-list-item">
          <div class="top">
            <div style="min-width:0"><div class="rname">${esc(node.name)}</div>
              <div class="rsub">중분류 ${cnt.subs}개 · 목록 ${cnt.lists}개</div></div>
            <button class="btn btn-ghost btn-sm" data-impgo="${node.id}">열기</button>
          </div>
        </div>`;
    });
  } else if(!c2){
    if(!(c1.children||[]).length) rows = '<div class="hint" style="margin:0">중분류가 없습니다.</div>';
    (c1.children||[]).forEach(node=>{
      rows += `
        <div class="admin-list-item">
          <div class="top">
            <div style="min-width:0"><div class="rname">${esc(node.name)}</div>
              <div class="rsub">목록 ${(node.lists||[]).length}개</div></div>
            <button class="btn btn-ghost btn-sm" data-impgo="${node.id}">열기</button>
          </div>
        </div>`;
    });
  } else if(!L){
    const items = listsOfCat(c2).filter(x=>x !== curList());
    if(!items.length) rows = '<div class="hint" style="margin:0">불러올 목록이 없습니다.</div>';
    items.forEach(x=>{
      rows += `
        <div class="admin-list-item">
          <div class="top">
            <div style="min-width:0"><div class="rname">${esc(listLabel(x))}</div>
              <div class="rsub">대화 ${x.threads.length}개</div></div>
            <button class="btn btn-ghost btn-sm" data-impgo="${esc(x.key)}">열기</button>
          </div>
        </div>`;
    });
  } else {
    if(!L.threads.length) rows = '<div class="hint" style="margin:0">이 목록에는 대화가 없습니다.</div>';
    L.threads.forEach((t, ti)=>{
      const last = t.messages[t.messages.length-1];
      rows += `
        <div class="admin-list-item">
          <div class="top">
            <div style="min-width:0">
              <div class="rname">${esc(threadLabel(t))}</div>
              <div class="rsub">참여자 ${(t.participants||[]).length}명 · 메시지 ${t.messages.length}개</div>
              <div class="rsub">${esc(previewText(last) || '(내용 없음)')}</div>
            </div>
            <button class="btn btn-primary btn-sm" data-imp="${esc(L.key)}:${ti}">불러오기</button>
          </div>
        </div>`;
    });
  }

  const crumb = [c1 && c1.name, c2 && c2.name, L && listLabel(L)].filter(Boolean).join(' › ') || '전체 분류';
  return `
    <div style="background:#f7f9fb;border:1px solid #e3e7ec;border-radius:10px;padding:10px;margin-bottom:10px">
      <div class="hint" style="margin:0 0 8px">다른 대화 목록의 대화를 <b>상대 정보·메시지 그대로</b> 이 목록(<b>${esc(listLabel(curList()))}</b>)으로 복사합니다. 원본은 그대로 남습니다.</div>
      <div class="crumb">
        ${impPath.length ? '<button class="btn btn-ghost btn-sm" id="impUp">↑ 상위 폴더</button>' : ''}
        <span class="crumb-txt">${esc(crumb)}</span>
      </div>
      ${rows}
      <button class="btn btn-ghost btn-sm btn-block" id="importThreadClose">닫기</button>
    </div>`;
}

function bindThreadListSection(scope){
  const root = scope || $('#adminBody');
  if(!root) return;
  const as = $('#ed-autoSort');
  if(as) as.onchange = e=>{ curList().autoSort = e.target.checked; save(); renderAdminHome(); };
  const tdIn = $('#ed-today');
  if(tdIn) tdIn.onchange = ()=>{
    const parsed = parseDateInput(tdIn.value);
    if(parsed === null){ toast('날짜를 알아볼 수 없습니다. 예: 20260504'); tdIn.value = curList().today || ''; return; }
    curList().today = parsed; save(); renderAdminHome();
  };
  const tdc = $('#ed-todayClear');
  if(tdc) tdc.onclick = ()=>{ curList().today = ''; save(); renderAdminHome(); };
  const at = $('#addThread'); if(at) at.onclick = addThread;
  const ib = $('#importThreadBtn');
  if(ib) ib.onclick = ()=>{ importOpen = !importOpen; if(importOpen) impPath = []; renderAdminHome(); };
  const irc = $('#importThreadClose'); if(irc) irc.onclick = ()=>{ importOpen = false; renderAdminHome(); };
  const iup = $('#impUp'); if(iup) iup.onclick = ()=>{ impPath.pop(); renderAdminHome(); };
  root.querySelectorAll('[data-impgo]').forEach(b=> b.onclick = ()=>{ impPath.push(b.dataset.impgo); renderAdminHome(); });
  root.querySelectorAll('[data-imp]').forEach(b=> b.onclick = ()=>{
    const raw = String(b.dataset.imp);
    const cut = raw.lastIndexOf(':');
    const srcList = listByKey(raw.slice(0, cut));
    const src = srcList && srcList.threads[+raw.slice(cut+1)];
    if(!src){ toast('원본 대화를 찾을 수 없습니다'); return; }
    const copy = deepCopy(src);
    copy.id = id();
    (copy.participants||[]).forEach(p=> p.id = id());
    (copy.messages||[]).forEach(m=> m.id = id());
    curList().threads.push(copy);
    save(); renderAdminHome();
    toast(`“${threadLabel(copy)}” 대화를 불러왔습니다`);
  });
  root.querySelectorAll('[data-edit]').forEach(b=> b.onclick = ()=> editThread(b.dataset.edit));
  root.querySelectorAll('[data-del]').forEach(b=> b.onclick = ()=> delThread(b.dataset.del));
  root.querySelectorAll('[data-up]').forEach(b=> b.onclick = ()=> moveThread(b.dataset.up,-1));
  root.querySelectorAll('[data-down]').forEach(b=> b.onclick = ()=> moveThread(b.dataset.down,1));
}

    pane.innerHTML = wideAdmin()
      ? '<div class="pane-empty">왼쪽 <b>분류</b>에서 테마의 <b>열기</b>를 누르면<br>그 테마의 대화가 여기 표시됩니다.</div>'
      : '';
    const m0 = $('#paneMsgs'); if(m0) m0.innerHTML = '';
    const ab0 = $('#adminBody'); if(ab0) ab0.classList.remove('thread-open');
    return;
  }
  pane.innerHTML = (wideAdmin() ? threadListHtml() : '')
    + (th ? threadEditorHtml(th) : (wideAdmin() ? '<div class="pane-empty">위 목록에서 대화의 <b>편집</b>을 누르세요.</div>' : ''));
  pane.scrollTop = keep;
  if(wideAdmin()) bindThreadListSection($('#adminBody'));
  if(th){ bindThreadEditor(th, th.id); renderThreadMessages(th.id); }
  else { const m = $('#paneMsgs'); if(m) m.innerHTML = ''; }
  const ab = $('#adminBody');
  if(ab) ab.classList.toggle('thread-open', !!th);
}

/* 새 대화 — “이 기기의 나”와 상대 한 명으로 시작한다 */
function addThread(){
  const L = curList();
  const ps = peopleOf(L);
  const me = personById(L, effMeId()) || ps[0] || null;
  let other = ps.find(p=>!me || p.id !== me.id) || null;
  const mk = (nm, silo)=>{
    let p = personByName(L, nm);
    if(!p){ p = {id:newPersonId(L, nm), name:nm, sub:'', avatar:'', silo:silo}; L.people.push(p); }
    return p;
  };
  const meP = me || mk('나', 0);
  const otherP = other || mk('새 상대방', 1);
  const th = { id:id(), isGroup:false, only:[], per:{},
    participants:[
      {id:id(), name:meP.name},
      {id:id(), name:otherP.name}
    ],
    messages:[] };
  L.threads.push(th); save(); applyMeFlags(); editThread(th.id);
}
function delThread(tid){
  const th = findThread(tid);
  confirmDialog(`“${th?threadLabel(th):''}” 대화를 삭제할까요?`, ()=>{
    const L = curList();
    L.threads = L.threads.filter(t=>t.id!==tid); save(); renderAdminHome(); toast('삭제되었습니다');
  });
}
function moveThread(tid, dir){
  const L = curList();
  const i = L.threads.findIndex(t=>t.id===tid);
  const j = i+dir;
  if(j<0||j>=L.threads.length) return;
  [L.threads[i], L.threads[j]] = [L.threads[j], L.threads[i]];
  save(); renderAdminHome();
}

/* 대화 편집 칸의 버튼 연결 */
function bindThreadEditor(th, tid){
  const L = curList();
  const back = $('#backList');
  if(back) back.onclick = ()=>{ save(); adminThreadId = ''; renderPane2(); renderAdminHome(true); };
  $('#rg').onchange = e=>{ th.isGroup = e.target.checked; save(); editThread(tid); };

  /* 이 대화를 볼 사람 */
  const onlyAll = $('#onlyAll');
  if(onlyAll) onlyAll.onchange = ()=>{
    if(onlyAll.checked){ th.only = []; }
    else {
      th.only = (th.participants||[]).map(p=>{ const q = personByName(L, p.name); return q ? q.id : ''; }).filter(Boolean);
    }
    save(); editThread(tid);
  };
  document.querySelectorAll('#onlyBox [data-only]').forEach(cb=> cb.onchange = ()=>{
    const pid = cb.dataset.only; if(!pid) return;
    if(!Array.isArray(th.only)) th.only = [];
    if(cb.checked){ if(th.only.indexOf(pid) < 0) th.only.push(pid); }
    else th.only = th.only.filter(x=>x !== pid);
    save();
  });

  const addSel = $('#addPartSel');
  $('#addPart').onclick = ()=>{
    const p = addSel ? personById(L, addSel.value) : null;
    if(!p || inThread(th, p.name)) return;
    th.participants.push({id:id(), name:p.name});   /* 사진은 인물 명단에만 둔다 */
    th.isGroup = th.participants.length > 2;
    save(); editThread(tid);
  };
  $('#addPartNew').onclick = ()=>{
    const v = ($('#newPart').value||'').trim(); if(!v) return;
    let p = personByName(L, v);
    if(!p){ const list = peopleOf(L); p = {id:newPersonId(L, v), name:v, sub:'', avatar:'', silo:list.length%2}; list.push(p); }
    if(inThread(th, p.name)){ toast('이미 참여자에 있습니다'); return; }
    th.participants.push({id:id(), name:p.name});   /* 사진은 인물 명단에만 둔다 */
    th.isGroup = th.participants.length > 2;
    save(); editThread(tid);
  };
  renderParticipants(th, tid);
}

/* 편집 화면에서 오른쪽(파란 말풍선)에 놓을 사람 —
   이 기기에서 고른 “나”가 이 대화에 있으면 그 사람, 아니면 참여자 맨 위 사람 */
function editorMe(th){
  const me = personById(curList(), effMeId());
  if(me && inThread(th, me.name)) return me.name;
  return ((th.participants||[])[0] || {}).name || '';
}
function otherPartsOf(th){
  const me = normKey(editorMe(th));
  return (th.participants||[]).filter(p=>normKey(p.name) !== me);
}
function lastOtherName(th){
  const me = normKey(editorMe(th));
  for(let i=th.messages.length-1; i>=0; i--){
    const n = th.messages[i].senderName;
    if(n && normKey(n) !== me && partOf(th, n)) return n;
  }
  const os = otherPartsOf(th);
  return os[0] ? os[0].name : '';
}
/* 3번째 칸: 대화 내용 */

  const th = findThread(tid);
  if(!th){ const m = $('#paneMsgs'); if(m) m.innerHTML = ''; return; }

  $('#paneMsgs').innerHTML = `
    <div class="admin-section">
      <h3>대화 내용 <span class="rsub">${esc(threadLabel(th))}</span></h3>

        날짜는 <b>20260504</b> → 2026-05-04 로 바뀌며, <b>바뀌는 날의 첫 메시지</b>에만 넣으면 그 자리에 회색 날짜 구분선이 뜹니다.</div>
      <div id="msgList"></div>

            ? `<select id="addWho" style="flex:0 1 160px;min-width:0">${others.map(p=>`<option ${p.name===lastOther?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`

          <button class="btn btn-ghost" id="addMsgOther">＋ ${others.length>1 ? '상대 메시지' : esc(lastOther || '상대방')}</button>
        </div>
        <button class="btn btn-primary right" id="addMsgMine">＋ ${esc(meName)}</button>
      </div>
    </div>`;
  const addMsgBy = who=>{
    const lastMsg = th.messages[th.messages.length-1];
    th.messages.push({id:id(), senderName:who, text:'', image:'',
      time:(lastMsg?lastMsg.time:''), date:'', status:''});
    save(); renderThreadMessages(tid); renderPane2();

    const sel = $('#addWho');
    addMsgBy(sel ? sel.value : (lastOther || (others[0]||{}).name || ''));
  };
  const am = $('#addMsgMine');
  if(am) am.onclick = ()=> addMsgBy(meName);
  renderMsgEditors(th, tid);
}

/* 참여자 줄 — 이름·사진은 인물에 저장되고, 안읽음·고정은 사람마다 따로 */
function renderParticipants(th, tid){
  const L = curList();
  const box = $('#partList'); box.innerHTML = '';
  (th.participants||[]).forEach(p=>{
    const person = personByName(L, p.name);
    const pid = person ? person.id : '';
    const pv = perOf(th, pid);
    const manual = (typeof pv.unread === 'number' && pv.unread >= 0);
    const face = faceOf(p);
    const row = document.createElement('div');
    row.className = 'part-row';
    row.innerHTML = `
      <div class="part-thumb" title="사진 변경" style="${avatarStyle(p)}">${avatarInner(p)}</div>
      <div class="part-info">
        <div class="part-name">
          <input class="part-name-input" data-a="name" value="${esc(p.name)}" placeholder="이름">
          ${pid && pid===meId() ? '<span class="me-tag">이 기기의 나</span>' : ''}
        </div>
        <div class="part-actions">
          <button class="btn btn-ghost btn-sm" data-a="photo">${face.avatar?'사진 변경':'＋ 사진'}</button>
          ${face.avatar?'<button class="btn btn-ghost btn-sm" data-a="photoDel">사진 제거</button>':'<button class="btn btn-ghost btn-sm" data-a="silo">실루엣 색</button>'}
          <button class="btn btn-danger btn-sm" data-a="del">빼기</button>
        </div>
        <div class="part-actions" style="border-top:1px dashed #e3e7ec;margin-top:6px;padding-top:6px">
          <span class="rsub" style="flex-basis:100%">${esc(p.name)} 님의 폰에서 이 대화는</span>
          <label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px">
            <input type="checkbox" data-a="uman" ${manual?'checked':''} style="width:auto"> 안읽음 직접</label>
          <input type="number" min="0" data-a="unum" style="width:70px;padding:5px 8px"
                 value="${manual ? pv.unread : autoUnreadFor(th, pid)}" ${manual?'':'disabled'}>
          <label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px">
            <input type="checkbox" data-a="pin" ${pv.pinned?'checked':''} style="width:auto"> 📌고정</label>
        </div>
      </div>`;

    const nameInput = row.querySelector('[data-a="name"]');
    nameInput.onchange = ()=>{
      const v = nameInput.value.trim();
      if(!v || !person){ nameInput.value = p.name; return; }
      if(normKey(v) === normKey(person.name)){ nameInput.value = person.name; return; }
      const dup = personByName(L, v);
      if(dup && dup !== person){
        nameInput.value = person.name;
        confirmDialog('이미 “' + dup.name + '” 인물이 있습니다.\n두 인물을 한 사람으로 합칠까요?', ()=>{
          renamePerson(L, person, v); save(); editThread(tid); renderAdminHome(); toast('한 사람으로 합쳤습니다');
        }, '합치기');
        return;
      }
      if(renamePerson(L, person, v)){ save(); editThread(tid); renderAdminHome(); }
      else nameInput.value = p.name;
    };

    const setPhoto = url=>{
      const per = person || personByName(L, p.name);
      if(per){ per.avatar = url; spreadPerson(L, per); }
      save(); renderParticipants(th, tid); renderMsgEditors(th, tid);
    };
    const pickPhoto = ()=> pickImage(FACE_PX, url=>{ setPhoto(url); toast('사진이 설정되었습니다 (이 인물이 있는 모든 대화에 적용)'); }, true);
    row.querySelector('.part-thumb').onclick = pickPhoto;
    row.querySelector('[data-a="photo"]').onclick = pickPhoto;
    const delPhoto = row.querySelector('[data-a="photoDel"]');
    if(delPhoto) delPhoto.onclick = ()=> setPhoto('');
    const siloBtn = row.querySelector('[data-a="silo"]');
    if(siloBtn) siloBtn.onclick = ()=>{
      const per = person || personByName(L, p.name);
      if(per){ per.silo = (per.silo===1)?0:1; spreadPerson(L, per); }
      save(); renderParticipants(th, tid); renderMsgEditors(th, tid);
    };

    /* 사람마다 따로 : 안읽음 · 고정 */
    const uMan = row.querySelector('[data-a="uman"]');
    const uNum = row.querySelector('[data-a="unum"]');
    uMan.onchange = ()=>{
      if(uMan.checked){ perSet(th, pid, 'unread', Math.max(0, Number(uNum.value)||0)); uNum.disabled = false; }
      else { perSet(th, pid, 'unread', null); uNum.disabled = true; uNum.value = autoUnreadFor(th, pid); }
      save();
    };
    uNum.oninput = ()=>{ if(uMan.checked){ perSet(th, pid, 'unread', Math.max(0, Number(uNum.value)||0)); save(); } };
    row.querySelector('[data-a="pin"]').onchange = e=>{ perSet(th, pid, 'pinned', e.target.checked); save(); };

    row.querySelector('[data-a="del"]').onclick = ()=>{
      if((th.participants||[]).length <= 1){ toast('최소 1명은 필요합니다'); return; }
      th.participants = th.participants.filter(x=>x.id!==p.id);
      if(pid && th.per) delete th.per[pid];
      if(Array.isArray(th.only)) th.only = th.only.filter(x=>x !== pid);
      th.isGroup = th.participants.length > 2;
      save(); editThread(tid);
    };
    box.appendChild(row);
  });
}

function renderMsgEditors(th, tid){
  const box = $('#msgList'); box.innerHTML = '';
  if(!th.messages.length){
    const em = document.createElement('div');
    em.className = 'hint';
    em.style.margin = '0 0 4px';
    em.textContent = '메시지가 없습니다. 아래 ＋ 버튼으로 추가하세요.';
    box.appendChild(em);
  }

  const meName = editorMe(th);
  const opts = (th.participants||[]).map(p=>p.name);
  th.messages.forEach((msg, i)=>{
    const ed = document.createElement('div');
    const mine = normKey(msg.senderName) === normKey(meName);
    ed.className = 'msg-editor' + (mine ? ' mine' : '');
    ed.innerHTML = `
      <div class="who">${esc(msg.senderName || '(이름 없음)')}${mine ? ' · 나' : ''}</div>
      <div class="er1">
        <select class="who-sel" data-f="who" style="width:auto;flex:0 1 140px">
          ${opts.map(n=>`<option ${normKey(n)===normKey(msg.senderName)?'selected':''}>${esc(n)}</option>`).join('')}
        </select>
        <input data-f="time" style="flex:1;min-width:0" placeholder="1450" value="${esc(msg.time||'')}">
      </div>
      <div class="er1">
        <input data-f="date" style="flex:1;min-width:0" placeholder="20260504 (날짜가 바뀔 때만)" value="${esc(msg.date||'')}">
        <button class="btn btn-ghost btn-sm" data-a="dateClear" ${msg.date?'':'disabled'}>날짜 지움</button>
      </div>
      <div class="stamp" data-f="stamp">${msg.date?esc(formatKoreanDate(msg.date)):''}</div>
      <textarea data-f="text" placeholder="메시지 내용">${esc(msg.text||'')}</textarea>
      <div class="er2">
        ${msg.image?`<div class="msg-thumb"><img src="${msg.image}"></div>`:''}
        <button class="btn btn-ghost btn-sm" data-a="img">${msg.image?'사진 변경':'사진 첨부'}</button>
        ${msg.image?`<button class="btn btn-danger btn-sm" data-a="imgClear">사진 제거</button>`:''}
      </div>
      ${mine ? `<div class="er2" style="margin-top:8px">
        <label>상태표시 <span class="rsub">삼성 테마에서는 숫자 <b>1</b> 로 보입니다</span></label>
        <input type="text" data-f="status" placeholder="예) 읽음 / 전송됨 (비우면 없음)" value="${esc(msg.status||'')}">
      </div>` : ''}
      <div class="er3">
        <span class="spacer"></span>
        <button class="btn btn-ghost btn-sm" data-up="${i}" ${i===0?'disabled':''}>▲</button>
        <button class="btn btn-ghost btn-sm" data-down="${i}" ${i===th.messages.length-1?'disabled':''}>▼</button>
        <button class="btn btn-danger btn-sm" data-del="${i}">삭제</button>
      </div>`;

    /* 보낸 사람이 바뀌면 좌·우 위치도 바로 따라가도록 다시 그린다 */
    ed.querySelector('[data-f="who"]').onchange = e=>{
      msg.senderName = e.target.value;
      if(normKey(msg.senderName) !== normKey(editorMe(th))) msg.status = '';
      save(); renderMsgEditors(th, tid);
    };

    const timeInput = ed.querySelector('[data-f="time"]');
    const applyTime = ()=>{
      const parsed = parseTimeInput(timeInput.value);
      if(parsed === null){ toast('시간을 알아볼 수 없습니다. 예: 1450, 930, 오후 2:50'); timeInput.value = msg.time||''; return; }
      msg.time = parsed; timeInput.value = parsed; save();
    };
    timeInput.onchange = applyTime;
    timeInput.onblur = applyTime;

    const dateInput = ed.querySelector('[data-f="date"]');
    const stamp = ed.querySelector('[data-f="stamp"]');
    const applyDate = ()=>{
      const parsed = parseDateInput(dateInput.value);
      if(parsed === null){ toast('날짜를 알아볼 수 없습니다. 예: 20260504, 2026-05-04'); dateInput.value = msg.date||''; return; }
      msg.date = parsed; dateInput.value = parsed;
      stamp.textContent = parsed ? formatKoreanDate(parsed) : '';
      save(); renderMsgEditors(th, tid);
    };
    dateInput.onchange = applyDate;
    ed.querySelector('[data-a="dateClear"]').onclick = ()=>{ msg.date=''; save(); renderMsgEditors(th, tid); };

    ed.querySelector('[data-f="text"]').oninput = e=>{ msg.text = e.target.value; save(); };

    ed.querySelector('[data-a="img"]').onclick = ()=> pickImage(PHOTO_W, url=>{
      msg.image = url; if(save()) toast('사진이 첨부되었습니다'); renderMsgEditors(th, tid);
    });
    const imgClear = ed.querySelector('[data-a="imgClear"]');
    if(imgClear) imgClear.onclick = ()=>{ msg.image=''; save(); renderMsgEditors(th, tid); };

    const statusEl = ed.querySelector('[data-f="status"]');
    if(statusEl) statusEl.oninput = e=>{ msg.status = e.target.value; save(); };

    ed.querySelector('[data-del]').onclick = ()=>{ th.messages.splice(i,1); save(); renderMsgEditors(th, tid); };
    ed.querySelector('[data-up]').onclick = ()=>{ if(i>0){ [th.messages[i-1],th.messages[i]]=[th.messages[i],th.messages[i-1]]; save(); renderMsgEditors(th, tid);} };
    ed.querySelector('[data-down]').onclick = ()=>{ if(i<th.messages.length-1){ [th.messages[i+1],th.messages[i]]=[th.messages[i],th.messages[i+1]]; save(); renderMsgEditors(th, tid);} };
    box.appendChild(ed);
  });
}

/* ----- 이미지 선택 (캔버스 축소·압축) -----
   square=true 면 정사각형으로 잘라 축소(프로필용), 아니면 비율 유지 */
/* ---------- 사진 크기·화질 ----------
   눈에 띄게 뭉개지지 않는 선에서 조금 낮춰, 파일과 저장 공간을 아낀다. */
const PHOTO_W = 720;   /* 대화 속 사진 가로 최대 */
const PHOTO_Q = 0.72;  /* 대화 속 사진 화질 */
const FACE_PX = 180;   /* 프로필 사진 한 변 */
const FACE_Q  = 0.76;  /* 프로필 사진 화질 */

function pickImage(size, cb, square){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        if(square){
          canvas.width = size; canvas.height = size;
          const side = Math.min(img.width, img.height);
          const sx = (img.width - side)/2, sy = (img.height - side)/2;
          ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        } else {
          let w=img.width, h=img.height;
          if(w > size){ h = Math.round(h*size/w); w = size; }
          canvas.width=w; canvas.height=h;
          ctx.drawImage(img, 0, 0, w, h);
        }
        cb(canvas.toDataURL('image/jpeg', square ? FACE_Q : PHOTO_Q));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
  };
  inp.click();
}

/* ----- 백업 / 복원 ----- */
function downloadFile(name, text, mime){
  const blob = new Blob([text], {type: mime || 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
function newVersion(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
/* 서버 없이(파일을 직접 열었을 때도) 자기 자신의 소스를 만들어 낸다.
   화면에 그려둔 내용은 열 때마다 다시 그리므로 비워서 내보낸다. */
function selfHtml(){
  const root = document.documentElement.cloneNode(true);
  /* 관리자 3단 칸은 칸 자체(#paneHome/#paneThread/#paneMsgs)를 남기고 안쪽만 비운다 */
  ['#threadList','#messages','#paneHome','#paneThread','#paneMsgs','#branchList'].forEach(sel=>{
    const el = root.querySelector(sel); if(el) el.innerHTML = '';
  });
  const off = (sel, cls)=>{ const el = root.querySelector(sel); if(el) el.classList.remove(cls); };
  off('#adminBody','thread-open');
  off('#adminOverlay','active'); off('#roomScreen','active'); off('#pickBranch','show');
  off('#photoViewer','show'); off('#modePill','show'); off('#confirmBox','show'); off('#toast','show');
  const ls = root.querySelector('#listScreen'); if(ls) ls.removeAttribute('style');
  const ab = root.querySelector('#btnAdmin'); if(ab) ab.removeAttribute('style');
  const pi = root.querySelector('#photoViewerImg'); if(pi) pi.removeAttribute('src');
  const ts = root.querySelector('#toast'); if(ts) ts.textContent = '';
  const tc = root.querySelector('#themeColor'); if(tc) tc.setAttribute('content', THEME_LIST);
  return '<!DOCTYPE html>\n' + root.outerHTML + '\n';
}
/* 지금 내용을 담은 새 index.html 을 만든다 (데이터 구간만 교체) */
function buildHtmlFrom(tpl){
  const i = tpl.indexOf(MARK_S), j = tpl.indexOf(MARK_E);
  if(i < 0 || j <= i) return null;
  const ver = newVersion();
  const json = JSON.stringify(data, null, 1).replace(/<\//g, '<\\/');
  const block = MARK_S + ' 아래 두 줄이 이 파일에 들어있는 대화 내용입니다. */\n'
    + 'const DATA_VERSION = ' + JSON.stringify(ver) + ';\n'
    + 'const EMBEDDED_DATA = ' + json + ';\n';
  return { html: tpl.slice(0,i) + block + tpl.slice(j), version: ver };
}
function finishExportHtml(built){
  if(!built){ toast('파일을 만들 수 없습니다'); return; }
  downloadFile('index.html', built.html, 'text/html;charset=utf-8');
  baseFp = fingerprint(data);
  save();
  toast('새 index.html 저장됨 · 버전 ' + built.version);
  if($('#adminOverlay').classList.contains('active')) renderAdminHome();
}
function exportHtml(){
  if(location.protocol.indexOf('http') !== 0){
    /* 파일로 직접 열었을 때는 “지금 열려 있는 화면의 코드”가 그대로 저장된다.
       기능이 추가된 파일을 새로 받은 뒤 새로고침 없이 내보내면 예전 코드로 되돌아가므로 한 번 확인한다. */
    confirmDialog(
      '지금 화면에 열려 있는 상태로 파일을 만듭니다.\n기능이 바뀐 파일을 새로 받았다면 먼저 새로고침(F5) 후에 만들어 주세요.',
      ()=> finishExportHtml(buildHtmlFrom(selfHtml())),
      '만들기'
    );
    return;
  }
  fetch('./index.html?_ex=' + Date.now(), {cache:'no-store'})
    .then(r=> r.ok ? r.text() : Promise.reject())
    .then(tpl=> finishExportHtml(buildHtmlFrom(tpl)))
    .catch(()=> finishExportHtml(buildHtmlFrom(selfHtml())));
}
function exportData(){
  const payload = { app:'단서메시지', version:DATA_VERSION, exportedAt:new Date().toISOString(), data:data };
  downloadFile('단서메시지_백업.json', JSON.stringify(payload,null,2), 'application/json');
  toast('백업 파일을 저장했습니다');
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try {
      const parsed = JSON.parse(reader.result);
      const body = (parsed && parsed.data) ? parsed.data : parsed;
      if(!body || (!body.lists && !body.threads)) throw new Error('bad');
      data = normalize(body);
      listIdx = 0; treePath = []; editingNode = ''; adminThreadId = '';
      applyMeFlags();
      if(!baseFp) baseFp = fingerprint(normalize(deepCopy(EMBEDDED_DATA)));
      save();               /* 현재 파일 버전으로 도장을 다시 찍어 저장 */
      toast('불러왔습니다');
      renderAdminHome(true);
    } catch(err){ toast('올바른 백업 파일이 아닙니다'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* 전체화면 토글 (오프라인 로컬 실행 시 주소창 없이 보기)
   손님 모드에서는 동작하지 않는다 — 관리자일 때만 쓰는 기능 */
function toggleFullscreen(){
  const el = document.documentElement;
  if(!document.fullscreenElement){
    (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
  }
}
$('#btnFull').onclick = ()=>{ if(isAdmin) toggleFullscreen(); };

/* 첫 화면 정하기
   - PC(넓은 화면)  : 편집용이므로 관리자 화면. 지점 잠금 없음.
   - 폰 · 처음      : 지점 고르기 → 그 지점 안에서 테마·인물 고르기
   - 폰 · 설정 끝난 뒤 : 손님 화면 */
let bootTries = 0;
function decideStartScreen(){
  if(!data) return;
  if(!window.innerWidth && bootTries < 20){ bootTries++; setTimeout(decideStartScreen, 200); return; }
  if(wideAdmin()){
    if(!isAdmin){ isAdmin = true; renderList(); openAdmin(!meId()); }
    return;
  }
  if(!lockedC1() && (data.tree||[]).length){ renderBranchPicker(); return; }
  fixListForBranch();
  fixListForMe();
  if(!meId()){ isAdmin = true; renderList(); openAdmin(true); return; }
  renderList();
}

(function boot(){
  /* 주소 끝에 ?reset=1 을 붙여 열면 폰에 저장된 내용과 캐시를 전부 지우고 파일 내용으로 시작한다 */
  let first = Promise.resolve();
  if(/[?&]reset=1/.test(location.search)){
    try{ localStorage.removeItem(STORE_KEY); localStorage.removeItem(LAST_KEY); localStorage.removeItem(VIEW_KEY); localStorage.removeItem(PAD_KEY); localStorage.removeItem(FONT_KEY); localStorage.removeItem(FACE_KEY); localStorage.removeItem(BRANCH_KEY); LEGACY_KEYS.forEach(k=>localStorage.removeItem(k)); }catch(e){}
    /* 쿠키에 적어 둔 몫도 같이 지운다 — 안 지우면 되살아난다 */
    try{ [LAST_KEY, VIEW_KEY, BRANCH_KEY, FONT_KEY, FACE_KEY].forEach(k=>{ document.cookie = k + '=;path=/;max-age=0'; }); }catch(e){}
    try{ first = idbClear(); }catch(e){}
    try{ if(window.caches && caches.keys) caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))); }catch(e){}
    try{
      if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
        navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));
      }
    }catch(e){}
  }
  loadView();
  loadBranch();
  first.catch(()=>{}).then(load).then(d=>{
    data = d;
    /* 한 단계가 실패해도 앱은 뜨게 한다. 실패한 단계는 기록해 화면에 보여준다. */
    step('selectListFromUrl', selectListFromUrl);
    step('applyMeFlags', applyMeFlags);
    step('save', save);
    step('syncUrl', syncUrl);
    step('renderList', renderList);
    try{ askPersist().then(refreshQuota).then(()=>{ try{ refreshAdminInfo(); }catch(e){} }); }catch(e){}
    if(saveBlocked) setTimeout(()=>toast('저장된 내용을 읽지 못했습니다. 내용 보호를 위해 저장을 멈췄습니다 — 앱을 껐다 켜 주세요.'), 700);
    step('decideStartScreen', decideStartScreen);
    window.addEventListener('load', ()=> step('decideStartScreen', decideStartScreen));
    if(bootErrors.length) showBootError();
  }).catch(err=>{
    bootErrors.push({ where:'load', err:err });
    showBootError();
  });
})();

/* ---------- 시작 중 오류 처리 ----------
   한 군데가 실패해도 흰 화면으로 두지 않는다. 무엇이 어디서 실패했는지 화면에 보여준다. */
let bootErrors = [];
function step(name, fn){
  try{ fn(); }
  catch(e){
    bootErrors.push({ where:name, err:e });
    try{ console.error('[단서메신저] ' + name + ' 실패', e); }catch(x){}
  }
}
function showBootError(){
  const el = document.getElementById(BOOT_ERR_BOX);
  if(!el) return;
  const lines = bootErrors.map(b=>{
    const e = b.err || {};
    const st = String(e.stack || '').split('\n').slice(0, 3).join(' / ');
    return '<b>' + esc(b.where) + '</b> — ' + esc(String(e.message || e.name || e))
         + (st ? '<br><span style="color:#b9c3cc">' + esc(st) + '</span>' : '');
  });
  el.innerHTML = '<div class="empty" style="user-select:text;-webkit-user-select:text;text-align:left;padding:24px 16px">'
    + '<div style="text-align:center;margin-bottom:14px">내용을 불러오지 못했습니다.<br><br>'
    + '주소 끝에 <b>?reset=1</b> 을 붙여 다시 열어보세요.<br>'
    + '브라우저에서 <b>Ctrl+Shift+R</b> 로 새로고침해도 됩니다.</div>'
    + '<div style="font-size:10.5px;line-height:1.55;word-break:break-all">코드 버전 ' + esc(CODE_VERSION) + '<br><br>'
    + (lines.length ? lines.join('<br><br>') : '저장된 내용을 읽는 중 응답이 없습니다')
    + '</div></div>';
}
setTimeout(function(){
  if(!data){ bootErrors.push({ where:'load', err:{message:'저장된 내용을 읽는 중 응답이 없습니다'} }); showBootError(); }
}, 6000);

/* 서비스워커: 최신 파일 우선(network-first) + 예전 캐시 자동 삭제 */
if(!('serviceWorker' in navigator)) swState = '이 브라우저는 지원 안 함';
else if(location.protocol.indexOf('http') !== 0) swState = '파일 직접 열기 — 사용 불가';
else {
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    swState = '작동 중';
    applyAppIdentity();
    refreshAdminInfo();
  });
  navigator.serviceWorker.register('./sw.js?v=' + encodeURIComponent(DATA_VERSION), {updateViaCache:'none'})
    .then(reg=>{
      swState = '등록됨 (제어 대기)';
      refreshAdminInfo();
      return navigator.serviceWorker.ready;
    })
    .then(()=>{
      swState = navigator.serviceWorker.controller ? '작동 중' : '등록됨 (새로고침하면 작동)';
      applyAppIdentity();
      refreshAdminInfo();
    })
    .catch(e=>{
      swState = '등록 실패: ' + ((e && e.message) ? e.message : String(e));
      refreshAdminInfo();
    });
}

/* 실행할 때마다 서버의 index.html 을 확인해서 새 파일이면 갈아끼운다 */
setTimeout(function once(){ if(!data){ setTimeout(once,500); return; } checkForUpdate(false); }, 1500);
</script>
